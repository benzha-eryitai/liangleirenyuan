      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="barrow"><span>' + (dset && dset.done ? '今日已完成' : '已完成 ' + doneN + ' / 30') + '</span><span>' + pct + '%</span></div>' +
      '<button class="btn primary block" data-act="daily">' + (dset && dset.done ? '今日再来一组' : (doneN ? '继续训练' : '开始今日训练')) + '</button>' +
      '</section>';

    var entries = '<div class="entries">' +
      '<button class="entry" data-act="daily"><b>每日训练 30 题</b><span>按卷面配比抽 30 题，当天固定</span></button>' +
      '<button class="entry" data-go="bank"><b>全题库</b><span>' + LR.all().length + ' 题，可按模块、题型、业务类型筛选</span></button>' +
      '<button class="entry" data-go="exam"><b>模拟考试</b><span>90 分钟 · 100 分 · 80 分合格</span></button>' +
      '<button class="entry" data-go="wrong"><b>错题集</b><span>' + (wi ? wi + ' 题待重做' : '暂无错题') + '</span></button>' +
      '</div>';

    var stats = '<div class="grid3">' +
      '<div class="card stat"><b>' + st + '</b><span>连续天数</span></div>' +
      '<div class="card stat"><b>' + t.cnt + '</b><span>累计答题</span></div>' +
      '<div class="card stat"><b>' + (t.cnt ? t.acc + '%' : '—') + '</b><span>正确率</span></div>' +
      '</div>';

    var modCard = '<section class="card">' +
      '<div class="cardhead"><h2>分模块掌握</h2><span class="hint">按已答题正确率</span></div>' +
      modRows +
      '</section>';

    var examCard = '<section class="card">' +
      '<div class="cardhead"><h2>最近模拟考</h2><button class="link" data-go="exam">去考试</button></div>' +
      (DB.exams.length ? DB.exams.slice(0, 3).map(function (e) {
        var dd = new Date(e.d);
        return '<div class="examrow"><div><b class="' + (e.pass ? 'good' : 'bad') + '">' + e.score + '</b> 分</div>' +
          '<div class="muted">' + (dd.getMonth() + 1) + '月' + dd.getDate() + '日 · ' + (e.pass ? '合格' : '未合格') + '</div></div>';
      }).join('') : '<p class="empty">还没考过。模拟卷 90 分钟、100 分、80 分及格。</p>') +
      '</section>';

    var setCard = '<section class="card">' +
      '<div class="cardhead"><h2>训练设置</h2></div>' +
      '<label class="field"><span>人员类别</span><select data-cfg="role">' +
      '<option value="safe"' + (DB.cfg.role === 'safe' ? ' selected' : '') + '>安全生产管理人员</option>' +
      '<option value="main"' + (DB.cfg.role === 'main' ? ' selected' : '') + '>主要负责人</option>' +
      '</select></label>' +
      '<label class="field"><span>业务类型</span><select data-cfg="bt">' +
      LR.BTS.map(function (n, i) { return i ? '<option value="' + i + '"' + (DB.cfg.bt === i ? ' selected' : '') + '>' + n + '</option>' : ''; }).join('') +
      '</select></label>' +
      '<p class="tip">卷面配比：' + (DB.cfg.role === 'safe' ? '法规 30 / 主体责任 10 / 管理知识 30 / 实务 30' : '法规 40 / 主体责任 30 / 管理知识 20 / 实务 10') +
      '。公共部分全部适用；专业部分只取所选业务类型，该类型题量不足时按同模块补入其他业务类型的实务题并在卷面标注。更换后每日训练与模拟卷按新设置组题。</p>' +
      (!storeOK ? '<p class="warn">当前浏览器不允许本地保存，进度只在本次打开有效。请用 Chrome / Edge / Safari 打开，或换手机浏览器再试。</p>' : '') +
      '</section>';

    return hero + entries + stats +
      '<div class="col2">' + modCard + examCard + '</div>' +
      '<div class="col2">' + setCard + backupCard() + '</div>' +
      (location.protocol === 'https:' ?
        '<p class="hosttip">手机上用浏览器菜单里的「添加到主屏幕」，以后点图标直接打开，不用再找链接。</p>' : '') +
      '<p class="foot">题源：两类人员安全考核公共部分题库、专业部分题库，共 ' + LR.all().length + ' 题。题库原文不含逐题解析，答错后可对照所附依据法规原文自查。</p>';
  }

  /* ---- 记录与备份 ---- */
  function daysSince(ts) { return ts ? Math.floor((Date.now() - ts) / 86400000) : null; }

  function bkBadge(st) {
    var ago = daysSince(DB.bk);
    if (!st.answered) return '<span class="bkbadge" id="bkbadge">还没有记录</span>';
    if (ago == null) return '<span class="bkbadge warnb" id="bkbadge">尚未备份</span>';
    if (ago >= 14) return '<span class="bkbadge warnb" id="bkbadge">' + ago + ' 天未备份</span>';
    return '<span class="bkbadge" id="bkbadge">' + (ago <= 0 ? '今天已备份' : ago + ' 天前备份') + '</span>';
  }

  function backupCard() {
    var st = LRBK.stat(DB);
    return '<section class="card" id="bkcard">' +
      '<div class="cardhead"><h2>记录与备份</h2>' + bkBadge(st) + '</div>' +
      '<p class="tip">做题记录和错题只存在这台设备的浏览器里，不上传。换手机、换浏览器、清理浏览器数据前，先备份。</p>' +
      '<div class="bkstat">' +
      '<div><b>' + st.answered + '</b><span>累计答题</span></div>' +
      '<div><b>' + st.wrong + '</b><span>错题待掌握</span></div>' +
      '<div><b>' + st.exams + '</b><span>模拟考次数</span></div>' +
      '</div>' +
      '<div class="bkrow"><div class="bl">记录码<i>一段文本，换设备时复制粘贴即可</i></div>' +
      '<button class="btn ghost" data-act="code">打开</button></div>' +
      '<div class="bkrow"><div class="bl">备份文件<i>导出 .json，可存网盘或发给自己</i></div>' +
      '<button class="btn ghost" data-act="export">导出</button></div>' +
      '<div class="bkrow"><div class="bl">用文件恢复<i>选择之前导出的备份文件</i></div>' +
      '<button class="btn ghost" data-act="import">选文件</button></div>' +
      '<div class="bkrow"><div class="bl">清空记录<i>成绩、错题、进度全部删除，不可撤销</i></div>' +
      '<button class="btn ghost danger" data-act="reset">清空</button></div>' +
      '</section>';
  }

  /* ---- 每日训练入口 ---- */
  function viewDaily() {
    var dset = DB.daily && DB.daily.date === today() ? DB.daily : null;
    if (dset && dset.done) {
      var r = { correct: dset.correct || 0, count: dset.ids.length, acc: Math.round((dset.correct || 0) * 100 / dset.ids.length) };
      return '<section class="card center">' +
        '<div class="eyebrow">今日训练完成</div>' +
        '<div class="bignum ' + (r.acc >= 80 ? 'good' : 'bad') + '">' + r.correct + '<small>/' + r.count + '</small></div>' +
        '<p class="sub">正确率 ' + r.acc + '%' + (r.acc >= 80 ? '，已达合格线水平' : '，建议再来一组') + '</p>' +
        '<div class="btnrow2"><button class="btn primary" data-act="daily-more">再来一组</button>' +
        '<button class="btn ghost" data-go="wrong">看错题</button></div></section>' +
        dailyWrongList(dset.ids, dset.ans, dset.lock);
    }
    var plan = LR.ROLE[DB.cfg.role].daily;
    return '<section class="card">' +
      '<div class="eyebrow">每日训练</div>' +
      '<h1>今天 30 题</h1>' +
      '<p class="sub">' + LR.ROLE[DB.cfg.role].name + ' · ' + LR.btName(DB.cfg.bt) + '</p>' +
      '<div class="plan">' +
      plan.map(function (n, m) { return '<div><b>' + n + '</b><span>' + LR.modName(m) + '</span></div>'; }).join('') +
      '</div>' +
      '<p class="tip">每天一组，题目按当天日期固定，同日重复打开是同一套。做完可再来一组。做错的题自动进错题本。</p>' +
      '<button class="btn primary block" data-act="daily">开始训练</button>' +
      '</section>';
  }

  function dailyWrongList(ids, ans, lock) {
    var wrongs = ids.filter(function (id) { return lock[id] && !LR.grade(LR.get(id), ans[id]); });
    if (!wrongs.length) return '';
    return '<section class="card"><div class="cardhead"><h2>本次做错</h2><span class="hint">' + wrongs.length + ' 题</span></div>' +
      wrongs.map(function (id) {
        var q = LR.get(id);
        return '<div class="qrow" data-open="' + id + '">' +
          '<div class="wmeta">' + LR.typeName(q.t) + ' · ' + LR.modName(q.m) + '</div>' +
          '<div class="qstem">' + esc(q.q) + '</div>' +
          '<div class="wans">正确答案：' + esc(ansText(q)) + '</div></div>';
      }).join('') + '</section>';
  }

  /* ---- 会话结果 ---- */
  function viewSessionResult() {
    var r = S.result;
    var wrongs = S.ids.filter(function (id) { return S.lock[id] && !LR.grade(LR.get(id), S.ans[id]); });
    var title = S.mode === 'daily' ? '今日训练完成' : (S.mode === 'wrong' ? '错题重练完成' : '练习完成');
    var tail = S.mode === 'wrong'
      ? '<p class="sub">答对 ' + r.correct + ' 题已移出错题集，剩余 ' + wrongIds().length + ' 题待掌握</p>'
      : '<p class="sub">正确率 ' + r.acc + '%' + (r.acc >= 80 ? '，已达合格线水平' : '，再练一轮更稳') + '</p>';
    var again = S.mode === 'daily'
      ? '<button class="btn primary" data-act="daily-more">再来一组</button>'
      : '<button class="btn primary" data-go="bank">回到题库</button>';
    return '<section class="card center">' +
      '<div class="eyebrow">' + title + '</div>' +
      '<div class="bignum ' + (r.acc >= 80 ? 'good' : 'bad') + '">' + r.correct + '<small>/' + r.count + '</small></div>' +
      tail +
      '<div class="btnrow2">' + again +
      '<button class="btn ghost" data-go="wrong">看错题' + (wrongs.length ? '（' + wrongs.length + '）' : '') + '</button></div>' +
      '</section>' +
      (wrongs.length ? '<section class="card"><div class="cardhead"><h2>本次做错</h2><span class="hint">' + wrongs.length + ' 题</span></div>' +
        wrongs.map(function (id) {
          var q = LR.get(id);
          return '<div class="qrow" data-open="' + id + '">' +
            '<div class="wmeta">' + LR.typeName(q.t) + ' · ' + LR.modName(q.m) + '</div>' +
            '<div class="qstem">' + esc(q.q) + '</div>' +
            '<div class="wans">正确答案：' + esc(ansText(q)) + '</div></div>';
        }).join('') + '</section>' : '');
  }

  /* ---- 答题器 ---- */
  function cellButtons() {
    return S.ids.map(function (id, i) {
      var cls = 'cell';
      if (has(S.ans, id)) cls += ' done';
      if (i === S.i) cls += ' cur';
      return '<button class="' + cls + '" data-jump="' + i + '">' + (i + 1) + '</button>';
    }).join('');
  }

  function viewRunner() {
    var q = curQ();
    if (!q) return '<section class="card"><p>题目加载失败，请退出重进。</p></section>';
    var picked = S.ans[q.i] || [];
    var locked = !!S.lock[q.i];
    var multi = (q.t === 1 || q.t === 3);
    var n = S.ids.length, idx = S.i + 1;
    var pct = Math.round(idx * 100 / n);
    var isExam = S.mode === 'exam';
    var answered = S.ids.filter(function (id) { return has(S.ans, id); }).length;

    var opts = q.o.map(function (text, oi) {
      var cls = 'opt';
      if (locked) {
        if (q.a.indexOf(oi) >= 0) cls += ' ok';
        else if (picked.indexOf(oi) >= 0) cls += ' bad';
      } else if (picked.indexOf(oi) >= 0) cls += ' sel';
      return '<button class="' + cls + '" data-pick="' + oi + '">' +
        '<i class="k">' + letter(oi) + '</i><span>' + esc(text) + '</span></button>';
    }).join('');

    var fb = '';
    if (locked) {
      var ok = LR.grade(q, picked);
      fb = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
        '<div class="fbtitle"><b>' + (ok ? '回答正确' : '回答错误') + '</b><span>正确答案 ' + ansKey(q) + '</span></div>' +
        '<div class="fbtxt">' + esc(ansText(q)) + '</div>' +
        (q.r && q.r.length ? '<div class="refs">依据 ' + q.r.map(function (x) { return '《' + esc(x) + '》'; }).join(' ') + '</div>' : '') +
        '</div>';
    }

    var prevBtn = '<button class="btn ghost" data-act="prev"' + (S.i === 0 ? ' disabled' : '') + '>上一题</button>';
    var submitBtn = '<button class="btn primary" data-act="submit"' + (picked.length ? '' : ' disabled') + '>提交答案</button>';
    var nextBtn = '<button class="btn ' + (locked ? 'primary' : 'ghost') + '" data-act="next">' + (S.i < n - 1 ? '下一题' : '完成') + '</button>';
    var footer, sideActs;

    if (isExam) {
      var lastBtn = S.i < n - 1
        ? '<button class="btn primary" data-act="next">下一题</button>'
        : '<button class="btn primary" data-act="ask-submit">交卷</button>';
      footer = '<div class="fbar">' + prevBtn +
        '<button class="btn" data-act="card">答题卡' + (answered < n ? ' ' + (n - answered) : '') + '</button>' + lastBtn + '</div>';
      sideActs = prevBtn + lastBtn;
    } else if (multi && !locked) {
      footer = '<div class="fbar">' + prevBtn + submitBtn + '<button class="btn ghost" data-act="next">跳过</button></div>';
      sideActs = prevBtn + submitBtn;
    } else {
      footer = '<div class="fbar">' + prevBtn + nextBtn + '</div>';
      sideActs = prevBtn + nextBtn;
    }

    var head = isExam
      ? '<div class="runhead"><button class="iconbtn" data-act="quit">×</button><div class="runtitle">' + esc(S.title) + '</div><div class="clock" id="clock">' + fmtClock(S.endsAt - Date.now()) + '</div></div>'
      : '<div class="runhead"><button class="iconbtn" data-act="quit">×</button><div class="runtitle">' + esc(S.title) + '</div><div class="qcount">' + idx + '/' + n + '</div></div>';

    var side = '<aside class="runside"><div class="sidecard">' +
      '<div class="sidecap"><b>' + (isExam ? '答题卡' : '本组进度') + '</b><i>已答 ' + answered + ' / ' + n + '</i></div>' +
      '<div class="pbar"><i style="width:' + Math.round(answered * 100 / n) + '%"></i></div>' +
      '<div class="cells cells-sm">' + cellButtons() + '</div>' +
      '<div class="sideacts">' + sideActs + '</div>' +
      '<p class="tip sm">' + (isExam ? '点题号可跳转回看；未答的题交卷按 0 分计。' : '题号可点击跳转；答完自动判分并记录。') + '</p>' +
      '</div></aside>';

    return '<div class="rungrid"><div class="runmain">' + head +
      '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
      '<section class="qcard">' +
      '<div class="qmeta"><span class="tag">' + LR.typeName(q.t) + '</span> ' + LR.modName(q.m) + (q.c ? ' · ' + LR.btName(q.b) : ' · 公共部分') +
      (S.paper && S.paper.borrowed && S.paper.borrowed[q.i] ? ' <span class="tag tag2">其他业务类型</span>' : '') + '</div>' +
      '<div class="stem">' + esc(q.q) + '</div>' +
      '<div class="opts">' + opts + '</div>' +
      (multi && !locked ? '<div class="tip sm">多选题：选全后提交，多选、少选都不得分。</div>' : '') +
      '</section>' + fb + footer + (cardOpen ? answerCardHTML() : '') +
      '</div>' + side + '</div>';
  }

  function answerCardHTML() {
    var answered = S.ids.filter(function (id) { return has(S.ans, id); }).length;
    return '<div class="sheet" data-mask="1"><div class="sheetbox">' +
      '<div class="cardhead"><h2>答题卡</h2><span class="hint">已答 ' + answered + '/' + S.ids.length + '</span></div>' +
      '<div class="cells">' + cellButtons() + '</div>' +
      '<button class="btn primary block" data-act="ask-submit">交卷</button>' +
      '<button class="btn ghost block" data-act="card">继续答题</button>' +
      '</div></div>';
  }

  /* ---- 考试 ---- */
  function viewExam() {
    var cfg = DB.cfg;
    var cfgRole = LR.ROLE[cfg.role];
    var pts = LR.paperPoints(cfgRole);
    var slots = cfgRole.slots;
    var cnt = slots.reduce(function (a, s) { return a + s[2]; }, 0);
    var byType = [0, 0, 0, 0], byPt = [0, 0, 0, 0];
    slots.forEach(function (s) { byType[s[0]] += s[2]; byPt[s[1]] += s[2] * LR.WEIGHT[s[0]]; });

    var intro = '<section class="card">' +
      '<div class="eyebrow">模拟考试</div>' +
      '<h1>' + cfgRole.name + '</h1>' +
      '<p class="sub">' + LR.btName(cfg.bt) + ' · ' + cnt + ' 题 · ' + pts + ' 分 · 90 分钟 · 80 分合格</p>' +
      '<div class="examgrid">' +
      '<div><b>' + byType[0] + '</b><span>单选 1分</span></div>' +
      '<div><b>' + byType[1] + '</b><span>多选 2分</span></div>' +
      '<div><b>' + byType[2] + '</b><span>判断 1分</span></div>' +
      '<div><b>' + byType[3] + '</b><span>案例 5分</span></div>' +
      '</div>' +
      '<div class="ratio">' + LR.MODS.map(function (n, m) {
        return '<div class="ratiorow"><span>' + LR.modName(m) + '</span><i><b style="width:' + Math.round(byPt[m] * 100 / pts) + '%"></b></i><em>' + byPt[m] + ' 分</em></div>';
      }).join('') + '</div>' +
      '<p class="tip">按考核大纲卷面配比组卷。交卷后即时判分，错题自动进错题本。</p>' +
      '<button class="btn primary block" data-act="start-exam">开始模拟考试</button>' +
      '</section>';

    var hist = '<section class="card"><div class="cardhead"><h2>历史成绩</h2><span class="hint">最近 8 次</span></div>' +
      (DB.exams.length ? DB.exams.slice(0, 8).map(function (e) {
        var d = new Date(e.d);
        return '<div class="examrow"><div><b class="' + (e.pass ? 'good' : 'bad') + '">' + e.score + '</b> 分</div>' +
          '<div class="muted">' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) +
          ' · ' + (e.pass ? '合格' : '未合格') + ' · 答对 ' + (e.correct || 0) + '/' + (e.count || 0) + '</div></div>';
      }).join('') : '<p class="empty">还没有考过。第一次考完，成绩会记在这里。</p>') +
      '</section>';

    return '<div class="col2 col2-wide">' + intro + hist + '</div>';
  }

  function viewExamReport() {
    var r = S.result;
    var actions = '<section class="card"><div class="btnrow2" style="margin-top:0">' +
      '<button class="btn primary" data-act="exam-again">再考一次</button>' +
      '<button class="btn ghost" data-go="wrong">查看错题</button></div></section>';
    var score = '<section class="card center">' +
      '<div class="eyebrow">' + (S.submitted ? '已交卷' : '考试结束') + '</div>' +
      '<div class="bignum ' + (r.pass ? 'good' : 'bad') + '">' + r.score + '<small>/' + r.total + '</small></div>' +
      '<p class="sub">' + (r.pass ? '达到 80 分合格线' : '距合格线还差 ' + (80 - r.score) + ' 分') + ' · 答对 ' + r.correct + '/' + r.count + ' 题</p>' +
      '</section>';
    var parts = '<section class="card"><div class="cardhead"><h2>分模块得分</h2></div>' +
      LR.MODS.map(function (n, m) {
        var p = r.full[m] ? Math.round(r.parts[m] * 100 / r.full[m]) : 0;
        return '<div class="modrow"><div class="modname">' + LR.modName(m) + '</div>' +
          '<div class="minibar"><i style="width:' + p + '%"></i></div>' +
          '<div class="modpct">' + r.parts[m] + '/' + r.full[m] + '</div><div class="modcnt"></div></div>';
      }).join('') + actions + '</section>';
    return '<div class="col2">' + score + parts + '</div>' +
      '<section class="card"><div class="cardhead"><h2>逐题回顾</h2><span class="hint">点题看详解</span></div>' +
      S.ids.map(function (id, i) {
        var q = LR.get(id), ok = LR.grade(q, S.ans[id]);
        return '<div class="qrow ' + (ok ? 'okrow' : '') + '" data-open="' + id + '">' +
          '<div class="wmeta">' + (i + 1) + '. ' + LR.typeName(q.t) + ' · ' + LR.modName(q.m) + ' <b class="' + (ok ? 'good' : 'bad') + '">' + (ok ? '✓' : '✗') + '</b></div>' +
          '<div class="qstem">' + esc(q.q) + '</div>' +
          '<div class="wans">正确答案：' + esc(ansText(q)) + '</div></div>';
      }).join('') + '</section>';
  }

  /* ---- 题库 ---- */
  function filtered() {
    var f = bankFilter, kw = f.kw.trim();
    return LR.all().filter(function (q) {
      if (f.c !== 'all' && q.c !== Number(f.c)) return false;
      if (f.bt !== 'all' && q.c === 1 && q.b !== Number(f.bt)) return false;
      if (f.m !== 'all' && q.m !== Number(f.m)) return false;
      if (f.t !== 'all' && q.t !== Number(f.t)) return false;
      if (kw && q.q.indexOf(kw) < 0) return false;
      return true;
    });
  }

  function chipRow(name, opts, cur) {
    return '<div class="chips">' + opts.map(function (o) {
      return '<button class="chip' + (String(o[0]) === String(cur) ? ' on' : '') + '" data-filter="' + name + '" data-val="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  function viewBank() {
    var list = filtered();
    var show = list.slice(0, bankPage * 30);
    var f = bankFilter;
    var btOpts = [['all', '全部业务']].concat(LR.BTS.map(function (n, i) {
      return i ? [String(i), n.replace('道路', '').replace('企业', '')] : null;
    }).filter(Boolean));

    return '<section class="card">' +
      '<div class="cardhead"><h2>全题库</h2><span class="hint">' + LR.all().length + ' 题</span></div>' +
      '<input class="search" type="search" placeholder="搜索题干关键词，例如 动态监控" data-kw value="' + esc(f.kw) + '">' +
      chipRow('c', [['all', '全部'], ['0', '公共部分'], ['1', '专业部分']], f.c) +
      (f.c !== '0' ? chipRow('bt', btOpts, f.bt) : '') +
      chipRow('m', [['all', '全部模块']].concat(LR.MODS.map(function (n, i) { return [String(i), LR.modName(i)]; })), f.m) +
      chipRow('t', [['all', '全部题型']].concat(LR.TYPES.map(function (n, i) { return [String(i), n.replace('题', '')]; })), f.t) +
      '<div class="btnrow"><button class="btn primary" data-act="practice-seq">顺序练这 ' + list.length + ' 题</button>' +
      '<button class="btn ghost" data-act="practice-rand">随机 20 题</button></div>' +
      '</section>' +
      '<section class="card listcard">' +
      (list.length ? show.map(function (q) {
        return '<div class="qrow" data-open="' + q.i + '">' +
          '<div class="wmeta">' + LR.typeName(q.t) + ' · ' + LR.modName(q.m) + ' · ' + (q.c ? LR.btName(q.b) : '公共') + '</div>' +
          '<div class="qstem">' + esc(q.q) + '</div></div>';
      }).join('') : '<p class="empty">没有符合条件的题，换个筛选试试。</p>') +
      (list.length > show.length ? '<button class="btn ghost block" data-act="more">加载更多（还有 ' + (list.length - show.length) + ' 题）</button>' : '') +
      '</section>';
  }

  /* ---- 错题集 ---- */
  function viewWrong() {
    var ids = wrongIds();
    if (!ids.length) {
      return '<section class="card center"><div class="eyebrow">错题集</div>' +
        '<p class="empty">还没有错题。做错的题会自动收进来，重练答对即自动移出。</p>' +
        '<button class="btn primary" data-act="daily">去每日训练</button></section>';
    }
    var byMod = [0, 0, 0, 0];
    ids.forEach(function (id) { byMod[LR.get(id).m]++; });
    return '<section class="card">' +
      '<div class="cardhead"><h2>错题集</h2><span class="hint">' + ids.length + ' 题待掌握</span></div>' +
      '<div class="grid4">' + byMod.map(function (n, m) {
        return '<div class="mini"><b>' + n + '</b><span>' + LR.modName(m) + '</span></div>';
      }).join('') + '</div>' +
      '<div class="btnrow"><button class="btn primary" data-act="wrong-train">开始错题重练</button>' +
      '<button class="btn ghost" data-act="wrong-clear">清空错题</button></div>' +
      '<p class="tip">重练答对即标为已掌握并移出列表；再错会累计次数。</p>' +
      '</section>' +
      '<section class="card listcard">' + ids.map(function (id) {
        var q = LR.get(id), w = DB.wrong[id];
        var d = new Date(w.t);
        return '<div class="qrow" data-open="' + id + '">' +
          '<div class="wmeta">' + LR.typeName(q.t) + ' · ' + LR.modName(q.m) + ' · 错 ' + w.n + ' 次 · ' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>' +
          '<div class="qstem">' + esc(q.q) + '</div>' +
          '<div class="wans">正确答案：' + esc(ansText(q)) + '</div></div>';
      }).join('') + '</section>';
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    if (e.target.id === 'layer') { closeLayer(); return; }
    var mask = e.target.closest('[data-mask]');
    if (mask && e.target === mask) { cardOpen = false; render(); return; }

    var el = e.target.closest('[data-pick],[data-jump],[data-filter],[data-open],[data-act],[data-go]');
    if (!el) return;

    if (el.hasAttribute('data-pick')) { e.preventDefault(); pick(Number(el.getAttribute('data-pick'))); return; }
    if (el.hasAttribute('data-jump')) { e.preventDefault(); S.i = Number(el.getAttribute('data-jump')); cardOpen = false; render(); return; }
    if (el.hasAttribute('data-filter')) {
      e.preventDefault();
      bankFilter[el.getAttribute('data-filter')] = el.getAttribute('data-val');
      bankPage = 1; render(); return;
    }
    if (el.hasAttribute('data-open')) { e.preventDefault(); openSingle(Number(el.getAttribute('data-open'))); return; }

    var act = el.getAttribute('data-act');
    if (act) {
      e.preventDefault();
      switch (act) {
        case 'daily': case 'daily-more': {
          var done = DB.daily && DB.daily.date === today() && DB.daily.done;
          startDaily(!!done);
          break;
        }
        case 'prev': prevQ(); break;
        case 'next': nextQ(); break;
        case 'submit': submitCur(); break;
        case 'card': cardOpen = !cardOpen; render(); break;
        case 'ask-submit': if (confirm('确定交卷？未答题按 0 分计。')) submitExam(); break;
        case 'start-exam': startExam(); break;
        case 'exam-again': startExam(); break;
        case 'practice-seq': startPractice(filtered(), '顺序练习', 'bank'); break;
        case 'practice-rand': startPractice(LR.shuffle(filtered(), Math.random).slice(0, 20), '随机练习', 'bank'); break;
        case 'more': bankPage++; render(); break;
        case 'wrong-train': startSession('wrong', wrongIds(), { title: '错题重练', tab: 'wrong' }); break;
        case 'wrong-clear': if (confirm('清空全部错题记录？')) { for (var k in DB.wrong) DB.wrong[k].ok = true; save(); render(); } break;
        case 'export': exportDB(); break;
        case 'import': importDB(); break;
        case 'code': openCode(); break;
        case 'close-layer': closeLayer(); break;
        case 'code-fill': fillCode(); break;
        case 'code-copy': copyCode(); break;
        case 'code-restore': restoreCode(); break;
        case 'reset': if (confirm('清空全部记录（成绩、错题、进度）？不可撤销。')) { DB = freshDB(); save(); S = null; go('home'); } break;
        case 'quit':
          if (S && S.mode === 'exam' && !S.submitted) {
            if (confirm('退出后本场考试作废，确定退出？')) { S = null; go('exam'); }
          } else { S = null; render(); }
          break;
      }
      return;
    }
    if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); }
  });

  document.addEventListener('change', function (e) {
    var sel = e.target.closest('[data-cfg]');
    if (!sel) return;
    var k = sel.getAttribute('data-cfg');
    DB.cfg[k] = (k === 'role') ? sel.value : Number(sel.value);
    DB.daily = null; save(); S = null; render();
  });

  document.addEventListener('input', function (e) {
    if (!e.target.matches('[data-kw]')) return;
    bankFilter.kw = e.target.value; bankPage = 1;
    clearTimeout(window.__kwT);
    window.__kwT = setTimeout(function () {
      render();
      var s = document.querySelector('[data-kw]');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 250);
  });

  document.addEventListener('keydown', function (e) {
    if (!S || S.result || S.tab !== tab) return;
    var q = curQ(); if (!q) return;
    if (e.key >= '1' && e.key <= '5' && !e.ctrlKey && !e.metaKey) {
      var i = Number(e.key) - 1;
      if (i < q.o.length) pick(i);
    } else if (e.key === 'Enter') {
      if (S.lock[q.i] || S.mode === 'exam') nextQ(); else submitCur();
    } else if (e.key === 'ArrowRight' && S.mode === 'exam') nextQ();
    else if (e.key === 'ArrowLeft') prevQ();
  });

  function openSingle(id) {
    var mode = tab === 'wrong' ? 'wrong' : 'practice';
    var opts = { title: '单题练习', tab: tab };
    if (mode === 'wrong') opts.title = '错题复看';
    startSession(mode, [id], opts);
    if (mode === 'wrong') S.fromWrong = true;
  }
  function startPractice(list, title, fromTab) {
    if (!list.length) return;
    startSession('practice', list.map(function (q) { return q.i; }), { title: title, tab: fromTab || 'bank' });
  }
  function startExam() {
    var p = LR.buildPaper(DB.cfg.role, DB.cfg.bt, Date.now());
    startSession('exam', p.ids, { title: '模拟考试', tab: 'exam', endsAt: Date.now() + 90 * 60 * 1000 });
    S.paper = p;
    render();
  }

  function startClock() {
    stopClock();
    tick = setInterval(function () {
      if (!S || !S.endsAt) { stopClock(); return; }
      var left = S.endsAt - Date.now();
      var c = document.getElementById('clock');
      if (c) { c.textContent = fmtClock(left); c.className = 'clock' + (left < 300000 ? ' warn' : ''); }
      if (left <= 0) { stopClock(); alert('考试时间到，自动交卷。'); submitExam(); }
    }, 1000);
  }

  /* ---------------- 记录码浮层与备份 ---------------- */
  var layerMode = null;
  var toastT = null;

  function flash(msg) {
    var t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.className = 'toast on';
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.className = 'toast'; }, 2400);
  }

  function renderLayer() {
    var el = document.getElementById('layer');
    if (!el) return;
    if (!layerMode) { el.className = 'layer'; el.innerHTML = ''; return; }
    el.className = 'layer on';
    if (layerMode === 'code') {
      var st = LRBK.stat(DB);
      el.innerHTML = '<div class="codesheet" role="dialog" aria-label="记录码">' +
        '<div class="codesheethead"><h2>记录码</h2><button class="x" data-act="close-layer" aria-label="关闭">×</button></div>' +
        '<p class="tip">本机现有 <b>' + st.answered + '</b> 次答题、<b>' + st.wrong + '</b> 道错题。换设备时：旧设备点「填入本机记录」再复制，新设备把内容粘到框里点「用此内容恢复」。</p>' +
        '<textarea id="codearea" class="codearea" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="把记录码粘贴到这里"></textarea>' +
        '<div class="btnrow"><button class="btn ghost" data-act="code-fill">填入本机记录</button>' +
        '<button class="btn ghost" data-act="code-copy">复制</button></div>' +
        '<div class="btnrow"><button class="btn primary" data-act="code-restore">用此内容恢复</button></div>' +
        '<p class="tip sm">记录码等于你的练习本，含全部成绩与错题，别公开发到群里。</p>' +
        '</div>';
    }
  }

  function openCode() {
    layerMode = 'code';
    renderLayer();
    var ta = document.getElementById('codearea');
    if (ta) ta.value = LRBK.pack(DB);
  }
  function closeLayer() { layerMode = null; renderLayer(); }

  function fillCode() {
    var ta = document.getElementById('codearea');
    if (!ta) return;
    ta.value = LRBK.pack(DB);
    ta.focus();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) { }
  }

  function markBackup() {
    DB.bk = Date.now();
    save();
    var b = document.getElementById('bkbadge');
    if (b) {
      var tmp = document.createElement('div');
      tmp.innerHTML = bkBadge(LRBK.stat(DB));
      var nb = tmp.firstChild;
      b.parentNode.replaceChild(nb, b);
    }
  }

  function copyCode() {
    var ta = document.getElementById('codearea');
    if (!ta) return;
    if (!ta.value) fillCode();
    var txt = ta.value;
    function ok() { markBackup(); flash('记录码已复制，可粘贴到微信文件传输助手保存'); }
    function manual() {
      try { ta.focus(); ta.setSelectionRange(0, txt.length); } catch (e) { }
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      if (done) ok(); else flash('浏览器不允许自动复制，请长按框内文字手动全选复制');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, manual);
    } else manual();
  }

  function restoreCode() {
    var ta = document.getElementById('codearea');
    var txt = ta ? ta.value : '';
    if (!txt || !txt.trim()) { flash('先把记录码粘贴到框里'); return; }
    var o;
    try { o = LRBK.unpack(txt); }
    catch (e) { alert('这段内容不是有效的记录码。请确认完整复制，中间不要漏字符。'); return; }
    var si = LRBK.stat(o), sc = LRBK.stat(DB);
    if (!confirm('用这段记录覆盖本机？\n\n这段记录：' + si.answered + ' 次答题、' + si.wrong + ' 道错题、' + si.exams + ' 次模拟考\n本机现有：' + sc.answered + ' 次答题、' + sc.wrong + ' 道错题\n\n覆盖后本机原记录不能恢复，建议先点「填入本机记录」留一份。')) return;
    DB = o;
    DB.bk = Date.now();
    save();
    S = null;
    closeLayer();
    go('home');
    flash('记录已恢复');
  }

  function exportDB() {
    var blob = new Blob([JSON.stringify(DB)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '两类人员训练进度-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    markBackup();
    flash('备份文件已导出，存到网盘或发给自己');
  }
  function importDB() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var o;
        try {
          o = LRBK.normalize(JSON.parse(fr.result));
        } catch (err) { alert('文件格式不对，不是本页导出的备份文件。'); return; }
        var si = LRBK.stat(o), sc = LRBK.stat(DB);
        if (!confirm('用这个文件覆盖本机记录？\n\n文件：' + si.answered + ' 次答题、' + si.wrong + ' 道错题、' + si.exams + ' 次模拟考\n本机：' + sc.answered + ' 次答题、' + sc.wrong + ' 道错题\n\n覆盖后本机原记录不能恢复。')) return;
        DB = o;
        DB.bk = Date.now();
        save(); S = null; closeLayer(); go('home');
        flash('记录已恢复');
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  /* ---------------- 启动 ---------------- */
  document.getElementById('tabs').innerHTML = navHTML();
  render();

  /* 托管到 https 时注册离线缓存，断网也能打开；本地文件打开不注册 */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    });
  }

  /* 自测/评审钩子：正常打开时 window.__BOOT 不存在，不会触发 */
  (function () {
    var b = window.__BOOT;
    if (!b) return;
    if (b.seed) {
      var now = Date.now(), i;
      for (i = 0; i < 6; i++) {
        var day = dstr(new Date(now - i * 86400000));
        DB.days[day] = [20 + (i % 4), 16 + (i % 3)];
      }
      DB.mstats = { 0: [420, 364], 1: [96, 82], 2: [130, 108], 3: [210, 171] };
      DB.rec = {};
      for (i = 0; i < 500; i++) DB.rec[i] = [2, 1];
      DB.wrong = {};
      [3, 17, 42, 88, 120].forEach(function (id, k) { DB.wrong[id] = { n: k % 3 + 1, t: now - k * 86400000, ok: false }; });
      DB.exams = [{ d: now - 2 * 86400000, score: 86, pass: true, count: 77, correct: 62 },
      { d: now - 5 * 86400000, score: 74, pass: false, count: 77, correct: 53 }];
      render();
    }
    if (b.start === 'daily') startDaily(false);
    else if (b.start === 'exam') startExam();
    else if (b.go) go(b.go);
    if (b.code) openCode();
    if (b.pick != null) setTimeout(function () { pick(b.pick); }, 20);
    if (b.card) setTimeout(function () { cardOpen = true; render(); }, 40);
  })();
})();

</script>
</body>
</html>
