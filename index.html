<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="两类人员练考">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="道路运输企业两类人员安全考核刷题：每日训练 30 题、全题库 1546 题、模拟考试、错题集。离线可用，进度存在本机。">
<title>两类人员 · 每日练考</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>

:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --ink: #16181d;
  --ink2: #4b5563;
  --muted: #8b95a1;
  --line: #e6e8ec;
  --pri: #2563eb;
  --pri-2: #1d4ed8;
  --pri-soft: #eef4ff;
  --ok: #12864b;
  --ok-soft: #eafaf1;
  --bad: #c92a2a;
  --bad-soft: #fdeeee;
  --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
h1 { font-size: 24px; margin: 6px 0 4px; letter-spacing: -.3px; font-weight: 700; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(245, 246, 248, .88);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid rgba(0, 0, 0, .04);
}
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; letter-spacing: .2px; }
.brand i { width: 8px; height: 17px; border-radius: 3px; background: linear-gradient(180deg, #3b82f6, #1d4ed8); display: inline-block; }
.brandspan { font-weight: 400; color: var(--muted); font-size: 12px; }
.topright { font-size: 12px; color: var(--muted); }
.topright b { color: var(--ink2); }

main { padding: 14px 14px 104px; max-width: 820px; margin: 0 auto; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; margin: 0 0 14px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
}
.hero { background: linear-gradient(180deg, #fff 0%, #fbfcff 100%); border-color: #dfe7fd; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.sub { margin: 0 0 14px; color: var(--ink2); font-size: 13.5px; }

.bar { height: 8px; border-radius: 99px; background: #eef1f6; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #60a5fa, #2563eb); transition: width .3s; }
.barrow { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 8px 0 14px; }

.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 12px; padding: 11px 16px; font-size: 15px; cursor: pointer;
  transition: transform .06s, box-shadow .15s, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pri); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(37, 99, 235, .22); font-weight: 600; }
.btn.ghost { background: #fff; }
.btn.danger { color: var(--bad); }
.btn.block { display: block; width: 100%; padding: 14px; margin-top: 4px; }
.btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
.btnrow { display: flex; gap: 10px; margin-top: 12px; }
.btnrow .btn { flex: 1; }
.btnrow2 { display: flex; gap: 10px; margin-top: 16px; }
.btnrow2 .btn { flex: 1; }

.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { text-align: center; padding: 14px 8px; margin: 0; }
.stat b { display: block; font-size: 22px; letter-spacing: -.5px; }
.stat span { font-size: 12px; color: var(--muted); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 14px; }
.mini { background: #f7f9fc; border-radius: 12px; padding: 10px 4px; text-align: center; }
.mini b { display: block; font-size: 17px; }
.mini span { font-size: 11.5px; color: var(--muted); }

.cardhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.link { background: none; border: 0; color: var(--pri); font-size: 13px; padding: 2px 4px; cursor: pointer; }

.modrow { display: grid; grid-template-columns: 68px 1fr 40px 50px; gap: 10px; align-items: center; padding: 7px 0; font-size: 13px; }
.modname { color: var(--ink2); }
.minibar { height: 6px; background: #eef1f6; border-radius: 99px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: #7aa2f7; border-radius: 99px; }
.modpct { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
.modcnt { text-align: right; color: var(--muted); font-size: 12px; }

.examrow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.examrow:first-of-type { border-top: 0; }
.examrow b { font-size: 19px; letter-spacing: -.5px; }
.muted { font-size: 12.5px; color: var(--muted); }
.good { color: var(--ok); }
.bad { color: var(--bad); }

.field { display: block; margin: 12px 0; }
.field span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
select {
  width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
  background: #fff; font-size: 14.5px; color: var(--ink); font-family: inherit;
}
.tip { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin: 10px 0 0; }
.tip.sm { font-size: 12px; }
.warn { font-size: 12.5px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; padding: 10px 12px; border-radius: 10px; margin-top: 12px; }
.foot { font-size: 12px; color: #9aa4b2; text-align: center; margin: 8px 0 20px; line-height: 1.8; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px 0; }

.runhead { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
.iconbtn {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
  background: #fff; font-size: 18px; line-height: 1; color: var(--ink2);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.runtitle { flex: 1; font-weight: 600; font-size: 14.5px; text-align: center; }
.qcount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; color: var(--pri); min-width: 56px; text-align: right; }
.clock.warn { color: var(--bad); }
.pbar { height: 4px; background: #e9edf4; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.pbar i { display: block; height: 100%; background: var(--pri); border-radius: 99px; transition: width .25s; }

.qcard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.qmeta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.tag { display: inline-block; background: var(--pri-soft); color: var(--pri-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; margin-right: 6px; }
.stem { font-size: 16.5px; line-height: 1.85; letter-spacing: .1px; margin-bottom: 16px; white-space: pre-wrap; }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  display: flex; gap: 11px; align-items: flex-start; text-align: left; width: 100%;
  background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px;
  font-size: 15px; line-height: 1.7; color: var(--ink); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.opt .k {
  flex: 0 0 24px; height: 24px; border-radius: 50%; border: 1px solid #cfd6e2;
  color: var(--ink2); font-size: 12.5px; font-style: normal; display: grid; place-items: center; margin-top: 1px;
}
.opt.sel { border-color: var(--pri); background: var(--pri-soft); }
.opt.sel .k { background: var(--pri); border-color: var(--pri); color: #fff; }
.opt.ok { border-color: #79c99b; background: var(--ok-soft); }
.opt.ok .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.bad { border-color: #f0a3a3; background: var(--bad-soft); }
.opt.bad .k { background: var(--bad); border-color: var(--bad); color: #fff; }

.fb { border-radius: 14px; padding: 14px 16px; margin-top: 12px; border: 1px solid; }
.fb.ok { background: var(--ok-soft); border-color: #bfe7d1; }
.fb.bad { background: var(--bad-soft); border-color: #f6c9c9; }
.fbtitle { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 6px; }
.fbtitle span { font-size: 12px; color: var(--ink2); }
.fbtxt { font-size: 14.5px; line-height: 1.7; }
.refs { font-size: 12.5px; color: var(--ink2); margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0, 0, 0, .08); }

/* 手机：操作条固定在底部导航之上，不再吸附浮动遮挡内容 */
.fbar {
  position: fixed; left: 0; right: 0; bottom: 62px; z-index: 35;
  display: flex; gap: 10px; margin: 0;
  padding: 10px 14px; background: #fff; border-top: 1px solid var(--line);
  box-shadow: 0 -4px 18px rgba(16, 24, 40, .07);
}
body.running main { padding-bottom: 210px; }
.fbar .btn { flex: 1; }

.sheet { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: flex-end; z-index: 60; padding: 12px; }
.sheetbox { background: #fff; border-radius: 20px; padding: 18px; width: 100%; max-width: 520px; margin: 0 auto; max-height: 80vh; overflow: auto; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin: 14px 0; }
.cell { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-variant-numeric: tabular-nums; }
.cell.done { background: var(--pri-soft); border-color: #bfd3fb; color: var(--pri-2); font-weight: 600; }
.cell.cur { outline: 2px solid var(--pri); outline-offset: 1px; }

.qrow { padding: 13px 0; border-top: 1px solid var(--line); cursor: pointer; }
.qrow:first-child { border-top: 0; }
.wmeta { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.qstem {
  font-size: 14.5px; line-height: 1.65; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.wans { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.listcard { padding: 4px 18px; }

.bignum { font-size: 54px; font-weight: 700; letter-spacing: -2px; line-height: 1.1; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.bignum small { font-size: 19px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.center { text-align: center; }
.center .sub { text-align: center; }

.plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
.plan div { background: #f7f9fc; border-radius: 12px; padding: 12px 4px; text-align: center; }
.plan b { display: block; font-size: 19px; letter-spacing: -.5px; }
.plan span { font-size: 12px; color: var(--muted); }

.examgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.examgrid div { background: #f7f9fc; border-radius: 12px; padding: 12px 4px; text-align: center; }
.examgrid b { display: block; font-size: 19px; }
.examgrid span { font-size: 11.5px; color: var(--muted); }
.ratio { margin: 4px 0 2px; }
.ratiorow { display: grid; grid-template-columns: 60px 1fr 52px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; color: var(--ink2); }
.ratiorow i { height: 6px; background: #eef1f6; border-radius: 99px; overflow: hidden; display: block; }
.ratiorow i b { display: block; height: 100%; background: var(--pri); border-radius: 99px; }
.ratiorow em { font-style: normal; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 13px; color: var(--ink2); cursor: pointer; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; margin-top: 4px; background: #fff; font-family: inherit; }
.search:focus { outline: 2px solid #c7d9fb; outline-offset: 0; border-color: #b9cdf8; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .93); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.tab { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #93a0b0; font-size: 11px; position: relative; cursor: pointer; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--pri); }
.tab .badge { position: absolute; top: 1px; left: calc(50% + 5px); background: var(--bad); color: #fff; font-size: 9px; font-style: normal; border-radius: 9px; padding: 1px 4px; min-width: 15px; text-align: center; }

@media (min-width: 760px) {
  main { padding: 20px 20px 120px; }
  .tabs { left: 50%; right: auto; transform: translateX(-50%); bottom: 16px; width: min(520px, calc(100% - 40px)); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(16, 24, 40, .10); padding: 6px; }
  .fbar { bottom: 96px; }
  body.running main { padding-bottom: 230px; }
  .stem { font-size: 17px; }
}

/* 首页四个功能入口 */
.entries { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
.entry {
  text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 14px 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,.04);
  transition: transform .06s, border-color .15s;
}
.entry:active { transform: translateY(1px); border-color: #c7d6fb; }
.entry b { display: block; font-size: 15px; margin-bottom: 4px; letter-spacing: -.2px; }
.entry span { display: block; font-size: 12px; line-height: 1.45; color: var(--muted); }
.tag2 { background: #fff4e5; color: #9a5b00; margin-left: 4px; }
.field select {
  width: 100%; max-width: 100%; padding: 9px 10px; font-size: 15px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
@media (max-width: 360px) {
  .entries { grid-template-columns: 1fr; }
}

/* ---- 移动端横向溢出兜底（全题库筛选条与长题干） ---- */
html, body { max-width: 100%; overflow-x: hidden; }
main { width: 100%; overflow-x: hidden; }
.card, .qcard, .listcard { max-width: 100%; min-width: 0; }
/* 筛选项自动换行：手机上所有按钮一眼可见，不做横向滑动、不裁切 */
.chips { flex-wrap: wrap; overflow: visible; padding: 8px 0; row-gap: 8px; }
.chip { flex: 0 0 auto; }
.btnrow, .btnrow2 { flex-wrap: wrap; }
.btnrow .btn, .btnrow2 .btn { flex: 1 1 auto; min-width: 0; white-space: normal; }
.stem, .qstem, .refs, .qrow, .qmeta, .wmeta, .wans, .sub, .tip, .search { max-width: 100%; }
.stem, .qstem, .refs, .qrow, .qmeta, .wmeta, .wans { word-break: break-word; overflow-wrap: anywhere; }
@media (max-width: 420px) {
  .card { padding: 16px 14px; }
  .listcard { padding: 4px 14px; }
}


/* ---- 记录与备份 ---- */
.bkstat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 2px; }
.bkstat div { background: #f7f9fc; border-radius: 12px; padding: 10px 6px; text-align: center; }
.bkstat b { display: block; font-size: 17px; letter-spacing: -.3px; }
.bkstat span { font-size: 11.5px; color: var(--muted); }
.bkrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.bkrow:last-of-type { border-bottom: 0; }
.bkrow .bl { font-size: 14px; line-height: 1.45; }
.bkrow .bl i { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.bkrow .btn { flex: 0 0 auto; padding: 8px 14px; font-size: 14px; }
.bkbadge { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); }
.bkbadge.warnb { background: #fff7ed; color: #b45309; }

/* ---- 记录码浮层 ---- */
.layer { position: fixed; inset: 0; z-index: 80; display: none; background: rgba(16, 24, 40, .45); }
.layer.on { display: flex; align-items: flex-end; justify-content: center; }
.codesheet {
  background: #fff; width: 100%; max-width: 560px; padding: 18px 16px 22px;
  border-radius: 20px 20px 0 0; max-height: 90vh; overflow: auto;
  box-shadow: 0 -8px 32px rgba(16, 24, 40, .18);
}
.codesheethead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.codesheethead h2 { font-size: 17px; }
.codesheet .x {
  border: 0; background: #f1f3f7; width: 30px; height: 30px; border-radius: 99px;
  font-size: 18px; line-height: 1; color: var(--ink2); cursor: pointer;
}
.codearea {
  width: 100%; height: 132px; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; margin-top: 10px; resize: vertical; background: #fbfcfe;
  font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace; color: var(--ink2);
  word-break: break-all; -webkit-user-select: text; user-select: text;
}
.codesheet .btnrow { margin-top: 10px; }
@media (min-width: 640px) {
  .layer.on { align-items: center; }
  .codesheet { border-radius: 20px; }
}
.hosttip { font-size: 12px; color: var(--muted); text-align: center; margin: 0 0 14px; line-height: 1.7; }

/* ---- 轻提示 ---- */
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 10px);
  background: rgba(22, 24, 29, .93); color: #fff; font-size: 13px; line-height: 1.5;
  padding: 10px 16px; border-radius: 12px; max-width: 82vw; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---- 导航结构：手机是底部图标栏，桌面变成左侧竖栏 ---- */
.tabs .sidehead, .tabs .sidefoot { display: none; }
.tabs .tabwrap { display: flex; flex: 1; }
.tab .tabdesc { display: none; }
.tab .tablabel { line-height: 1.2; }
/* 右侧答题卡面板只在桌面出现，手机上用底部操作条 */
.runside { display: none; }

/* ================= 桌面版（≥1000px） ================= */
@media (min-width: 1000px) {
  body { padding-left: 236px; background: #f4f6f9; }
  .topbar { display: none; }

  /* 左侧导航 */
  .tabs {
    position: fixed; left: 0; top: 0; right: auto; bottom: auto;
    width: 236px; height: 100vh; transform: none;
    display: flex; flex-direction: column; align-items: stretch;
    padding: 20px 14px 16px; gap: 0; overflow-y: auto;
    background: #fff; border: 0; border-right: 1px solid var(--line);
    border-radius: 0; box-shadow: none;
  }
  .tabs .sidehead { display: block; padding: 0 6px 16px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .sidelogo { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .sidelogo i { width: 8px; height: 18px; border-radius: 3px; background: linear-gradient(180deg, #3b82f6, #1d4ed8); }
  .sidesub { font-size: 12px; color: var(--muted); margin-top: 7px; padding-left: 16px; }
  .tabs .tabwrap { display: block; }
  .tab {
    width: 100%; flex: none; flex-direction: row; align-items: center; justify-content: flex-start;
    gap: 10px; text-align: left; padding: 10px 12px; margin-bottom: 2px;
    border-radius: 10px; font-size: 14.5px; color: var(--ink2);
  }
  .tab svg { width: 19px; height: 19px; flex: 0 0 19px; }
  .tab .tabdesc { display: block; margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .tab:hover { background: #f5f7fb; }

  .tabs .sidefoot {
    display: block; margin-top: 16px; padding: 12px 12px;
    border-radius: 12px; background: #f7f9fc;
    font-size: 12px; line-height: 1.65; color: var(--muted);
  }

  /* 内容区 */
  main { max-width: 1160px; margin: 0 auto; padding: 26px 34px 64px; }
  h1 { font-size: 28px; letter-spacing: -.5px; }
  .card { padding: 22px 24px; border-radius: 16px; }
  .hero { display: block; }
  .hero .btn.block { max-width: 300px; }
  .entries { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .entry { padding: 16px; }
  .entry b { font-size: 15.5px; }
  .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .col2-wide { grid-template-columns: 1.15fr 1fr; }
  .col2 > .card, .col2 > section { margin-bottom: 0; }
  .grid3 { gap: 14px; margin-bottom: 14px; }
  .stat { padding: 18px 8px; }
  .stat b { font-size: 26px; }
  .listcard { padding: 6px 24px; }
  .qrow { padding: 15px 0; }
  .qrow:hover { background: #fafbfe; }
  .qstem { -webkit-line-clamp: 2; font-size: 15px; }
  .chips { padding: 10px 0; gap: 8px; }
  .search { max-width: 520px; }
  .modrow { grid-template-columns: 96px 1fr 52px 56px; font-size: 13.5px; padding: 8px 0; }
  .examgrid div, .plan div { padding: 14px 4px; }

  /* 答题器：左题目、右答题卡 */
  .rungrid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
  .runside { display: block; position: sticky; top: 24px; }
  .sidecard {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .sidecap { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: var(--ink2); margin-bottom: 9px; }
  .sidecap i { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sidecard .pbar { margin-bottom: 12px; }
  .cells-sm { grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0 14px; max-height: 272px; overflow-y: auto; }
  .cells-sm .cell { height: 34px; font-size: 12.5px; border-radius: 8px; }
  .sideacts { display: flex; gap: 8px; }
  .sideacts .btn { flex: 1; padding: 10px 6px; font-size: 14px; }
  .sidecard .tip { margin-top: 10px; }
  .fbar { display: none; }
  body.running main { padding-bottom: 64px; }
  .runhead { margin: 0 0 10px; }
  .qcard { padding: 24px 26px; border-radius: 16px; }
  .stem { font-size: 17.5px; }
  .opt { padding: 14px 16px; }
  .opt:hover { border-color: #c3d3f7; }
  .sheet { align-items: center; }
  .sheetbox { border-radius: 20px; max-height: 84vh; }
  .toast { bottom: 40px; }
  .foot { margin-top: 6px; }
}

}

0],"r":["中华人民共和国道路交通安全法"],"i":341},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，对6个月内发生2次以上特大交通事故负有主要责任或者全部责任的专业运输单位，由公安机关交通管理部门责令消除安全隐患；未消除安全隐患的机动车，禁止上道路行驶。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法"],"i":342},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，国家实行机动车第三者责任自愿保险制度，设立道路交通事故社会救助基金。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法"],"i":343},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，已注册登记的机动车所有权发生转移的，应当及时办理转移登记。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法"],"i":344},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，机动车所有人将机动车作为抵押物抵押的，机动车所有人应当向登记该机动车的交通运输管理部门申请抵押登记。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法"],"i":345},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，为确保机动车安全技术检验质量，公安机关交通管理部门可要求机动车到指定的场所进行检验。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法"],"i":346},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，公安机关交通管理部门以外的任何单位或者个人，不得收缴、扣留机动车驾驶证。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法"],"i":347},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，对交通事故损害赔偿的争议，当事人可以请求公安机关交通管理部门调解，也可以直接向人民法院提起刑事诉讼。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法"],"i":348},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法》，机动车之间发生交通事故的，由有过错的一方承担赔偿责任；双方都有过错的，按照各自过错的比例分担责任。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法"],"i":349},{"c":0,"b":0,"m":0,"t":2,"q":"国家制订《中华人民共和国道路交通安全法》的目的是为了维护道路交通秩序，预防和减少交通事故，保护人身安全，保护公民、法人和其他组织的财产安全及其他合法权益，提高通行效率。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法"],"i":350},{"c":0,"b":0,"m":0,"t":2,"q":"中华人民共和国境内的车辆驾驶人、行人、乘车人以及与道路交通活动有关的单位和个人，都应当遵守《中华人民共和国道路交通安全法》。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法"],"i":351},{"c":0,"b":0,"m":0,"t":2,"q":"国家机动车产品主管部门根据机动车国家安全技术标准认定的企业生产的机动车，在出厂时经检验符合机动车国家安全技术标准，获得检验合格证的，免予安全技术检验。","o":["正确","错误"],"a":[0],"r":[],"i":352},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国刑法》，交通肇事罪是指违反交通运输管理法规，发生重大事故，致人重伤、死亡或者使公私财产遭受重大损失，依法被追究刑事责任的犯罪行为。","o":["正确","错误"],"a":[0],"r":["中华人民共和国刑法"],"i":353},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国刑法》，重大责任事故罪是指在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或者造成其他严重后果的，处三年以下有期徒刑或者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。","o":["正确","错误"],"a":[0],"r":["中华人民共和国刑法"],"i":354},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国刑法》，重大劳动安全事故罪是指安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的，对直接负责的主管人员和其他直接责任人员，处三年以下有期徒刑或者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。","o":["正确","错误"],"a":[0],"r":["中华人民共和国刑法"],"i":355},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国消防法》，火灾扑灭后，发生火灾的单位和相关人员无需按照消防救援机构的要求保护现场，但要接受事故调查，如实提供与火灾有关的情况。","o":["正确","错误"],"a":[1],"r":["中华人民共和国消防法"],"i":356},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国消防法》，道路运输企业应落实消防安全责任制，制定本单位的消防安全制度、消防安全操作规程，制定灭火和应急疏散预案。","o":["正确","错误"],"a":[0],"r":["中华人民共和国消防法"],"i":357},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国消防法》，人员密集场所的门窗不得设置影响逃生和灭火救援的障碍物。","o":["正确","错误"],"a":[0],"r":["中华人民共和国消防法"],"i":358},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国突发事件应对法》，所有单位应不定期检查本单位各项安全防范措施的落实情况，及时消除事故隐患。","o":["正确","错误"],"a":[1],"r":["中华人民共和国突发事件应对法"],"i":359},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国突发事件应对法》，任何单位和个人不得编造、传播有关突发事件事态发展或者应急处置工作的虚假信息。","o":["正确","错误"],"a":[0],"r":["中华人民共和国突发事件应对法"],"i":360},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国反恐怖主义法》，恐怖事件是指正在发生或者已经发生的造成或者可能造成重大社会危害的恐怖活动。","o":["正确","错误"],"a":[0],"r":["中华人民共和国反恐怖主义法"],"i":361},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国反恐怖主义法》，应对处置恐怖事件，应当优先保护直接受到恐怖活动危害、威胁人员的人身安全。","o":["正确","错误"],"a":[0],"r":["中华人民共和国反恐怖主义法"],"i":362},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国反恐怖主义法》，任何单位和个人发现宣扬极端主义的物品、资料、信息的，应当立即向国安部门报告。","o":["正确","错误"],"a":[1],"r":["中华人民共和国反恐怖主义法"],"i":363},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国职业病防治法》，用人单位应当建立、健全职业病防治责任制，加强对职业病防治的管理，提高职业病防治水平，对本单位产生的职业病危害承担责任。","o":["正确","错误"],"a":[0],"r":["中华人民共和国职业病防治法"],"i":364},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国职业病防治法》，用人单位应当依照法律、法规要求，严格遵守国家职业卫生标准，落实职业病预防措施，从源头上控制和消除职业病危害。","o":["正确","错误"],"a":[0],"r":["中华人民共和国职业病防治法"],"i":365},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国职业病防治法》，用人单位必须采用有效的职业病防护设施，并为劳动者提供个人使用的职业病防护用品。","o":["正确","错误"],"a":[0],"r":["中华人民共和国职业病防治法"],"i":366},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国职业病防治法》，对遭受或者可能遭受急性职业病危害的劳动者，用人单位应当及时组织救治、进行健康检查和医学观察，所需费用由用人单位和劳动者共同承担。","o":["正确","错误"],"a":[1],"r":["中华人民共和国职业病防治法"],"i":367},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国职业病防治法》，用人单位的主要负责人对本单位的职业病防治工作全面负责。","o":["正确","错误"],"a":[0],"r":["中华人民共和国职业病防治法"],"i":368},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国职业病防治法》，用人单位违反本法规定，已经对劳动者生命健康造成严重损害的，由卫生行政部门责令停止产生职业病危害的作业，或者提请有关人民政府按照国务院规定的权限责令关闭，并处二十万元以上五十万元以下的罚款。","o":["正确","错误"],"a":[1],"r":["中华人民共和国职业病防治法"],"i":369},{"c":0,"b":0,"m":0,"t":2,"q":"用人单位必须建立、健全劳动安全卫生制度，严格执行国家劳动安全卫生规程和标准，对劳动者进行劳动安全卫生教育，防止劳动过程中的事故，减少职业危害。","o":["正确","错误"],"a":[0],"r":[],"i":370},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国劳动法》，用人单位必须为劳动者提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品，但无需对从事有职业危害作业的劳动者定期进行健康检查。","o":["正确","错误"],"a":[1],"r":["中华人民共和国劳动法"],"i":371},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国民法典》，民事主体的人身权利、财产权利以及其他合法权益受法律保护，任何组织或者个人不得侵犯。","o":["正确","错误"],"a":[0],"r":["中华人民共和国民法典"],"i":372},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国民法典》，民事主体从事民事活动，不得违反法律，不得违背公序良俗。","o":["正确","错误"],"a":[0],"r":["中华人民共和国民法典"],"i":373},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国民法典》，承运人未按照约定路线或者通常路线运输增加票款或者运输费用的，旅客、托运人或者收货人应当支付增加部分的票款或者运输费用。","o":["正确","错误"],"a":[1],"r":["中华人民共和国民法典"],"i":374},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中共中央 国务院关于推进安全生产领域改革发展的意见》，应严格事故直报制度，对瞒报、谎报、漏报、迟报事故的单位和个人依法依规追责。","o":["正确","错误"],"a":[0],"r":["中共中央 国务院关于推进安全生产领域改革发展的意见"],"i":375},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中共中央国务院关于推进安全生产领域改革发展的意见》，要强化企业预防措施，建立健全隐患排查治理制度，重大隐患治理情况向负有安全生产监督管理职责的部门和企业职代会“双报告”制度，实行自查自改自报闭环管理。","o":["正确","错误"],"a":[0],"r":["中共中央国务院关于推进安全生产领域改革发展的意见"],"i":376},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中共中央 国务院关于推进安全生产领域改革发展的意见》，道路运输企业应对企业所属运营车辆定期进行安全检查，检查车内车辆应急装置和安全设施，确保技术状况良好。","o":["正确","错误"],"a":[0],"r":["中共中央 国务院关于推进安全生产领域改革发展的意见"],"i":377},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法实施条例》，安全事故发生后，有关单位和人员应当妥善保护事故现场以及相关证据，任何单位和个人不得破坏事故现场、毁灭相关证据。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法实施条例"],"i":378},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法实施条例》，公路客运载客汽车超过核定乘员、载货汽车超过核定载质量的，公安机关交通管理部门依法扣留机动车后，驾驶人应当将超载的乘车人转运、将超载的货物卸载，费用由超载机动车的乘客或者货主承担。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法实施条例"],"i":379},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法实施条例》，机动车在高速公路上行驶，遇有雾、雨、雪、沙尘、冰雹等低能见度气象条件时，能见度小于200米时，开启雾灯、近光灯、示廓灯和前后位灯，车速不得超过每小时40公里，与同车道前车保持100米以上的距离。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法实施条例"],"i":380},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法实施条例》，机动车在道路上发生故障或者发生交通事故，妨碍交通又难以移动的，应当按照规定开启危险报警闪光灯并在车后50米至100米处设置警告标志，夜间还应当同时开启示廓灯和后位灯。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法实施条例"],"i":381},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法实施条例》，机动车在高速公路上行驶，可以在匝道、加速车道或者减速车道上超车。","o":["正确","错误"],"a":[1],"r":["中华人民共和国道路交通安全法实施条例"],"i":382},{"c":0,"b":0,"m":0,"t":2,"q":"根据《中华人民共和国道路交通安全法实施条例》，机动车在高速公路上行驶，不得倒车、逆行、穿越中央分隔带掉头或者在车道内停车。","o":["正确","错误"],"a":[0],"r":["中华人民共和国道路交通安全法实施条例"],"i":383},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，特别重大事故、重大事故应逐级上报至国务院安全生产监督管理部门和负有安全生产监督管理职责的有关部门。","o":["正确","错误"],"a":[0],"r":["生产安全事故报告和调查处理条例"],"i":384},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，发生安全事故遇紧急情况时，事故现场有关人员可以直接向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告。","o":["正确","错误"],"a":[0],"r":["生产安全事故报告和调查处理条例"],"i":385},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，发生重大事故应逐级上报至省、自治区、直辖市人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门。","o":["正确","错误"],"a":[1],"r":["生产安全事故报告和调查处理条例"],"i":386},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》的相关规定，特别重大事故由国务院或者国务院授权有关部门组织事故调查组进行调查。","o":["正确","错误"],"a":[0],"r":["生产安全事故报告和调查处理条例"],"i":387},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，发生的特别重大生产安全事故由事故发生地省级人民政府组织事故调查组进行调查。","o":["正确","错误"],"a":[1],"r":["生产安全事故报告和调查处理条例"],"i":388},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，在道路运输过程中，造成5人死亡的生产安全事故应为一般事故。","o":["正确","错误"],"a":[1],"r":["生产安全事故报告和调查处理条例"],"i":389},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，报告事故的内容包括针对事故已采取的措施。","o":["正确","错误"],"a":[0],"r":["生产安全事故报告和调查处理条例"],"i":390},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，事故调查组可以聘请有关专家参与调查。","o":["正确","错误"],"a":[0],"r":["生产安全事故报告和调查处理条例"],"i":391},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，事故调查组向有关单位和个人 ,"r":["企业安全生产费用提取和使用管理办法"],"i":447},{"c":0,"b":0,"m":0,"t":2,"q":"根据《企业安全生产费用提取和使用管理办法》，承担集团安全生产责任的企业集团母公司（一级，简称集团总部），可以对全资及控股子公司提取的企业安全生产费用按照一定比例集中管理，统筹使用。子公司转出资金作为企业安全生产费用支出处理，集团总部收到资金作为专项储备管理，不计入集团总部收入。","o":["正确","错误"],"a":[0],"r":["企业安全生产费用提取和使用管理办法"],"i":448},{"c":0,"b":0,"m":0,"t":2,"q":"根据《企业安全生产费用提取和使用管理办法》，企业未按本办法提取和使用安全生产费用的，由县级以上应急管理部门、矿山安全监察机构及其他负有安全生产监督管理职责的部门和财政部门按照职责分工，责令限期改正 ，并依照《中华人民共和国安全生产法》、《中华人民共和国会计法》和相关法律法规进行处理、处罚。情节严重、性质恶劣的，依照有关规定实施联合惩戒。","o":["正确","错误"],"a":[0],"r":["企业安全生产费用提取和使用管理办法","中华人民共和国安全生产法","中华人民共和国会计法"],"i":449},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，生产经营单位风险种类多、可能发生多种类型事故的，应当组织编制应急演练预案。","o":["正确","错误"],"a":[1],"r":["生产安全事故应急预案管理办法"],"i":450},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，企业的应急预案应与当地政府、行业管理部门预案衔接，但无需上报当地有关部门备案。","o":["正确","错误"],"a":[1],"r":["生产安全事故应急预案管理办法"],"i":451},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，对于某一种或者多种类型的事故风险，生产经营单位可以编制相应的专项应急预案，或将专项应急预案并入综合应急预案。","o":["正确","错误"],"a":[0],"r":["生产安全事故应急预案管理办法"],"i":452},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，对于危险性较大的场所、装置或者设施，生产经营单位应当编制现场处置方案。","o":["正确","错误"],"a":[0],"r":["生产安全事故应急预案管理办法"],"i":453},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，事故风险单一、危险性小的生产经营单位，只需编制安全工作方案。","o":["正确","错误"],"a":[1],"r":["生产安全事故应急预案管理办法"],"i":454},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，应急预案评审的评审人员与所评审应急预案的生产经营单位有利害关系的，应当回避。","o":["正确","错误"],"a":[0],"r":["生产安全事故应急预案管理办法"],"i":455},{"c":0,"b":0,"m":0,"t":2,"q":"根据《生产安全事故应急预案管理办法》，生产经营单位应当按照应急预案的规定，对应急物资、装备进行定期检测和维护，使其处于适用状态。","o":["正确","错误"],"a":[0],"r":["生产安全事故应急预案管理办法"],"i":456},{"c":0,"b":0,"m":0,"t":2,"q":"应急预案的管理实行属地为主、分级负责、分类指导、综合协调、动态管理的原则。","o":["正确","错误"],"a":[0],"r":[],"i":457},{"c":0,"b":0,"m":0,"t":2,"q":"生产经营单位主要负责人负责组织编制和实施本单位的应急预案，并对应急预案的真实性和实用性负责；各分管负责人应当按照职责分工落实应急预案规定的职责。","o":["正确","错误"],"a":[0],"r":[],"i":458},{"c":0,"b":0,"m":0,"t":2,"q":"综合应急预案是指生产经营单位为应对各种生产安全事故而制定的综合性工作方案，是本单位应对生产安全事故的总体工作程序、措施和应急预案体系的总纲。","o":["正确","错误"],"a":[0],"r":[],"i":459},{"c":0,"b":0,"m":0,"t":2 ":3,"t":2,"q":"卫星定位装置出现故障、不能保持在线的车辆，客运企业不得安排其承担道路旅客运输经营任务。","o":["正确","错误"],"a":[0],"r":[],"i":838},{"c":1,"b":1,"m":3,"t":2,"q":"客运驾驶员更换新的客运车辆、客运线路的，也应当进行跟车实习。","o":["正确","错误"],"a":[0],"r":[],"i":839},{"c":1,"b":1,"m":3,"t":2,"q":"客运企业使用实习学生的，应当将实习学生纳入本企业从业人员统一进行安全生产教育培训。","o":["正确","错误"],"a":[0],"r":[],"i":840},{"c":1,"b":1,"m":3,"t":2,"q":"客运企业发现客运驾驶员有器质性心脏病，无需调离工作岗位。","o":["正确","错误"],"a":[1],"r":[],"i":841},{"c":1,"b":1,"m":3,"t":2,"q":"根据《中华人民共和国民法典》，承运人应当按照有效客票记载的时间、班次和座位号运输旅客。承运人迟延运输或者有其他不能正常运输情形的，应当及时告知和提醒旅客，采取必要的安置措施，并根据旅客的要求安排改乘其他班次或者退票；由此造成旅客损失的，承运人应当承担赔偿责任，但是不可归责于承运人的除外。","o":["正确","错误"],"a":[0],"r":["中华人民共和国民法典"],"i":842},{"c":1,"b":1,"m":3,"t":2,"q":"根据最高人民法院、最高人民检察院、公安部《关于依法惩治妨害公共交通工具安全驾驶违法犯罪行为的指导意见》，正在驾驶公共交通工具的驾驶人员遭到妨害安全驾驶行为侵害时，为避免公共交通工具倾覆或者人员伤亡等危害后果发生，采取紧急制动或者躲避措施，造成公共交通工具、交通设施损坏或者人身损害，符合法定条件的，应当认定为紧急避险。","o":["正确","错误"],"a":[0],"r":["关于依法惩治妨害公共交通工具安全驾驶违法犯罪行为的指导意见"],"i":843},{"c":1,"b":1,"m":3,"t":2,"q":"根据《道路运输从业人员管理规定》，经营性道路旅客运输驾驶员应当采取必要措施保证旅客的人身和财产安全，发生紧急情况时，应当积极进行救护。","o":["正确","错误"],"a":[0],"r":["道路运输从业人员管理规定"],"i":844},{"c":1,"b":1,"m":3,"t":2,"q":"根据《机动车强制报废标准规定》，营运载客汽车与非营运载客汽车相互转换的，按照营运载客汽车的规定报废。","o":["正确","错误"],"a":[0],"r":["机动车强制报废标准规定"],"i":845},{"c":1,"b":1,"m":3,"t":2,"q":"根据《道路运输企业和城市客运企业安全生产重大事故隐患判定标准（试行）》，所属客运车辆违法承运或夹带危险物品的，应判定为重大事故隐患。","o":["正确","错误"],"a":[0],"r":["道路运输企业和城市客运企业安全生产重大事故隐患判定标准（试行）"],"i":846},{"c":1,"b":1,"m":3,"t":2,"q":"根据《生产安全事故报告和调查处理条例》，道路旅客运输企业发生造成人员死亡、3 人（含）以上重伤、恶劣社会影响的生产安全事故后，为了不使企业声誉受损，不应对外公布。","o":["正确","错误"],"a":[1],"r":["生产安全事故报告和调查处理条例"],"i":847},{"c":1,"b":1,"m":3,"t":3,"q":"某日，某客运企业驾驶员刘某驾驶蒙KXXXXX大型客车从某客运站出发开往锡尼镇，8时35分，行驶至鄂尔多斯市杭锦旗运煤专线49公里加970米处（限速70公里/小时）发生侧翻的道路交通事故，事故造成2人死亡、3人重伤，6人轻伤及车辆、道路设施、网围栏路面受损，直接经济损失197.4万元。经调查：该客运企业的道路运输车辆动态监控社会化服务单位是鄂尔多斯市某公司，未按车辆行驶道路实际情况设置监控超速行驶的限值；交通事故前客车的行驶速度为87公里/小时至88公里/小时；事发时部分乘客未系安全带。根据案例内容，下列说法正确的是（  ）。","o":["驾驶员应按照操作规范安全驾驶，不得超速行车","驾驶员应要求乘车人系安全带","该客运企业安全生产主体责任落实不力","鄂尔多斯市某公司没有责任"],"a":[0,1,2],"r":[],"i":848},{"c":1,"b":1,"m":3,"t":3,"q":"某日，某客运企业驾驶员李某、王某交替驾驶豫AXXXXX大型客车，搭载61名务工人员，共63人，从正阳县出发，前往大格勒乡。行驶至青兰高速泾川段1487公里加100米处时，车辆在向左变更车道过程中，与中央隔离带护栏发生碰撞后，向右急转撞毁右侧护栏驶出路外，左侧翻于路基边坡。车内大部分人员（57人）未按规定使用安全带，部分人员被甩出车外，并被侧翻大客车碾压，造成13人当场死亡，44人受伤，直接经济损失约为2119.99万元。经调查：该客运企业有客运车辆83辆，主要负责人长时间不在岗， 2名专职安全生产管理人员只挂名不履职；事故车辆的两名驾驶员，一名为该企业长期雇用驾驶员，另一名为出车前临时雇用的驾驶员，均未与该企业签订用工合同。根据案例内容，下列说法正确的是（  ）。","o":["该企业没有落实安全生产管理责任制，安全生产管理机构形同虚设","客运驾驶员岗前培训应不少于12学时","客运驾驶员更换新的客运车辆、客运线路，应当跟车实习","该事故属于重大事故"],"a":[0,2,3],"r":[],"i":849},{"c":1,"b":1,"m":3,"t":3,"q":"某日，某客运企业驾驶员刘某驾驶湘DXXXXX大型客车从家中出发，按照某客运企业的包车派单计划，搭载57人（包括驾驶人刘某）。10时19分，当车辆行驶至宜凤高速公路宜章段33公里加856米处时失控，先后与道路中央护栏发生一次刮擦和三次碰撞，事故共造成35人死亡、13人受伤，车辆烧毁，高速公路路面及护栏受损，事故造成直接经济损失为 2290余万元。经调查：事发前连续3天驾驶员刘某于早晨7时前带团出发，期间除长时间驾驶车辆外，还陪同游客到景区游玩，但晚上睡觉的时间均在凌晨1时以后，身体没有得到充分休息；该客运企业有车辆120辆，仅配备1名动态监控人员李某，还兼职公司董事长司机、办理包车客运标志牌和部分文职工作，事故发生时不在岗；李某凭着运输管理所工作人员提供的账号、密码登录“某省道路运输信息管理系统”，使用盖有公章的空白市际旅游包车客运标志牌，自行套打了当日的旅游包车客运标志牌。根据案例内容，下列说法正确的是（  ）。","o":["驾驶人休息时间不满足安全驾驶要求","该客运企业应配备专职动态监控人员，应至少配备2人","该客运企业未经交通运输部门审核，自行非法打印市际旅游包车客运标志牌","该客运企业未对事故车辆进行安全例检"],"a":[0,1,2,3],"r":[],"i":850},{"c":1,"b":1,"m":3,"t":3,"q":"某日，某客运企业驾驶员赵某驾驶粤VXXXXX大型客车从某客运站出发开往揭阳普宁市占陇镇，搭载共50人（包括驾驶人赵某）。12时55分许，行驶至惠州市境内广河高速公路龙门段73公里加440米处时，车辆失控向左偏离行驶方向与公路中央分隔带护栏发生刮撞后旋转并掉头仰翻于中央分隔带上，造成客车上19人当场死亡、31人受伤，中央分隔带护栏及车辆损毁，事故造成直接经济损失为3152.17万元。经调查：事故车辆在动态监控平台中的行驶速度均为每小时90公里左右，最高值为每小时99公里，公安部交通管理科学研究所鉴定结论，事故车辆离开合口隧道后至事故发生前的平均行驶速度在每小时107.5公里至每小时122.3公里；该客运企业制定了驾驶人安全教育学习制度，但驾驶员赵某长期未参加安全教育培训；该客运企业长期变相挂靠经营、源头管理缺失、以包代管。根据案例内容，下列说法正确的是（  ）。","o":["企业主体责任不落实特别是私人购车变相挂靠是事故发生的原因","客运车辆动态监控平台没有发挥应有作用","客运企业应对驾驶员进行定期考核，考核周期不大于3个月","该事故属于重大事故"],"a":[0,1,2,3],"r":[],"i":851},{"c":1,"b":1,"m":3,"t":3,"q":"某日，某客运企业驾驶员王某、冯某交替驾驶豫CXXXXX大型客车从某客运中心出发前往河南省洛阳市，搭载49人（包含2名驾驶员、1名乘务员）。23时30分，当该车行驶至陕西省安康市境内京昆高速公路秦岭1号隧道南口1164公里加867米处时，正面冲撞隧道洞口端墙，导致车辆前部严重损毁变形、座椅脱落挤压，造成36人死亡、13人受伤，事故造成直接经济损失3533余万元。经调查：驾驶员王某在没有进行车辆例检的情况下办理了报班发车手续；客运中心出站安检员秦某上车进行了检查，但没有严格检查相关证件、没有认真核对出站乘客人数；驾驶员王某事发前已在夜间连续驾车2小时29分；动态监控平台未设置分段限速报警阈值，高速公路超速报警阈值统一设置为90公里/小时。根据案例内容，下列说法正确的是（  ）。","o":["汽车客运站应禁止未进行车辆例检的营运客车出站运行","出站检查工作人员应对出站营运客车和驾驶员的相关情况进行检查，严禁 :2,"m":3,"t":3,"q":"某日，驾驶员王某在凌晨5时吸食冰毒，于8时驾驶大型货车到上海市送货。当车辆行驶至沪陕高速公路时，驾驶员王某因吸食冰毒产生幻觉，怀疑前有警车拦截，后有警车跟踪， 突然向左变道“避让”，致使车辆与中央隔离带护栏发生碰撞，并越过护栏 后向右侧翻，与对向车道刘某驾驶的中型厢式货车相撞，造成1人死亡，2人受伤，经调查认定：此次事故是王某在疲劳、毒品残留在体内状态下驾驶车辆、操作失当是造成事故的直接原因，货车所属道路运输企业对驾驶员的管理不到位。未建立驾驶员管理档案，未对驾驶员进行上岗安全培训，属于未实施有效监督管理。根据案例内容，以下说法正确的是（  ）。","o":["道路运输企业要加强对驾驶员的管理，可在报班审核中加入有关药驾、毒驾的检测程序，确保驾驶员无“药驾、毒驾”驾驶","道路运输企业未建立驾驶员管理档案，未对驾驶员进行上岗安全培训，属于未实施有效监督管理","该运输企业安全生产管理存在盲区，最终导致发生事故，事故造成一定的社会影响。","驾驶员摄入禁用药物或吸食毒品后，感知能力和驾驶技能下降，甚至出现异常驾驶行为，严重危害行车安全。"],"a":[0,1,2,3],"r":[],"i":984},{"c":1,"b":2,"m":3,"t":3,"q":"某日，一辆号牌为豫NXXXX客车，由山东省临沂驶往河南商丘，行驶至山东省济宁市开发区崇文大道与王黄路交叉口时，与一辆号牌为鲁XXXXX的个体运输货车相撞，造成2人死亡、1人受伤、两车报废的重大交通事故。经调查，该货车在交叉路口时未按照交通信号灯行驶，属于闯红灯行为；所属道路运输企业安全管理不到位。货车所属道路运输企业未通过“道路运输车辆卫星定位系统动态监控平台”对车辆实施有效监控，未能及时提醒和纠正驾驶员的违法行为。根据案例内容，以下说法正确的是（  ）。","o":["驾驶员驾驶运输车辆时应遵守交通规则，遵守交通信号灯、交通标志和标线的指示","货车驾驶员在交叉路口时未按照交通信号灯行驶是该起事故的直接原因","道路运输企业要加强驾驶员的安全培训教育，提高驾驶员的安全意识","企业未落实安全生产主体责任，安全管理存在问题"],"a":[0,1,3],"r":[],"i":985},{"c":1,"b":3,"m":0,"t":0,"q":"根据《危险化学品安全管理条例》，在运输危险化学品过程中，应当根据危险化学品的危险特性采取相应的安全防护措施，并配备必要的（  ）。","o":["清洗设备","自动报警设备","环保设施","防护用品和应急救援器材"],"a":[3],"r":["危险化学品安全管理条例"],"i":986},{"c":1,"b":3,"m":0,"t":0,"q":"根据《危险化学品安全管理条例》,危险化学品运输车辆应当符合相应要求，下列说法正确的是（  ）。","o":["符合国家标准要求的安全技术条件，并按照国家有关规定定期进行安全技术检验","危险化学品运输车辆应限制其运输时间和运输线路，无需悬挂或者喷涂警示标志","危险化学品运输车辆通过行政许可，可适当超载运输","用于运输危险化学品的罐体以及其他容器无需保证封口严密"],"a":[0],"r":["危险化学品安全管理条例"],"i":987},{"c":1,"b":3,"m":0,"t":0,"q":"根据《危险化学品安全管理条例》，运输危险化学品对运输过程进行管理，下列说法错误的是（  ）。","o":["危险化学品运输车辆应当悬挂或者喷涂符合国家标准要求的警示标志","应当分别依照有关道路运输的法律、行政法规的规定，取得危险货物道路运输许可，并向市场监督管理部门办理登记手续","运输危险化学品的，托运人应当委托依法取得危险货物道路运输许可的企业承运","未经交通运输部门批准，运输危险化学品的车辆不得进入危险化学品运输车辆限制通行的区域"],"a":[3],"r":["危险化学品安全管理条例"],"i":988},{"c":1,"b":3,"m":0,"t":0,"q":"根据《危险化学品安全管理条例》，危险化学品道路运输企业未配备专职安全管理人员的，（  ）。","o":["处5万元以上，10万元以下罚款","处10万元以上罚款","处20万元以上罚款","由交通运输主管部门责令改正，可以处1万元以下的罚款；拒不改正的，处1万元以上5万元以下的罚款。"],"a":[3],"r":["危险化学品安全管理条例"],"i":989},{"c":1,"b":3,"m":0,"t":0,"q":"根据《危险化学品安全管理条例》，剧毒化学品、易制爆危险化学品在道路运输途中丢失、被盗、被抢或者出现流散、泄漏等情况的，驾驶人员、押运人员应当立即采取相应的警示措施和 误"],"a":[1],"r":[],"i":1190},{"c":1,"b":3,"m":3,"t":2,"q":"在我国现阶段，只要有车、有人、有货就可以从事危险货物道路运输。","o":["正确","错误"],"a":[1],"r":[],"i":1191},{"c":1,"b":3,"m":3,"t":2,"q":"遇水放出易燃气体的危险货物着火时，应用干砂、干粉灭火器进行灭火。","o":["正确","错误"],"a":[0],"r":[],"i":1192},{"c":1,"b":3,"m":3,"t":2,"q":"遇水反应的易燃固体着火时，不得用水灭火，应采用干砂、干粉灭火器进行扑救。","o":["正确","错误"],"a":[0],"r":[],"i":1193},{"c":1,"b":3,"m":3,"t":2,"q":"根据《道路运输从业人员管理规定》，企业安全管理人员应当按照安全作业规程对道路危险货物装卸作业进行现场监督，确保装卸安全。","o":["正确","错误"],"a":[1],"r":["道路运输从业人员管理规定"],"i":1194},{"c":1,"b":3,"m":3,"t":2,"q":"根据《道路运输从业人员管理规定》，道路危险货物运输驾驶员除可以驾驶道路危险货物运输车辆外，不可以驾驶原从业资格证件许可的道路旅客运输车辆或者道路货物运输车辆。","o":["正确","错误"],"a":[1],"r":["道路运输从业人员管理规定"],"i":1195},{"c":1,"b":3,"m":3,"t":2,"q":"根据《机动车强制报废标准规定》，全挂车、危险品运输半挂车使用10年，集装箱半挂车20年，其他半挂车使用15年。","o":["正确","错误"],"a":[0],"r":["机动车强制报废标准规定"],"i":1196},{"c":1,"b":3,"m":3,"t":2,"q":"根据《机动车强制报废标准规定》，危险品运输载货汽车、半挂车与其他载货汽车、半挂车相互转换的，按照危险品运输载货车、半挂车的规定报废。","o":["正确","错误"],"a":[0],"r":["机动车强制报废标准规定"],"i":1197},{"c":1,"b":3,"m":3,"t":2,"q":"根据《道路运输企业和城市客运企业安全生产重大事故隐患判定标准（试行）》，运输危险货物过程中包装容器损坏、泄漏的，不属于重大事故隐患。","o":["正确","错误"],"a":[1],"r":["道路运输企业和城市客运企业安全生产重大事故隐患判定标准（试行）"],"i":1198},{"c":1,"b":3,"m":3,"t":2,"q":"危险货物道路运输企业应急预案中设置应急组织，至少包括应急领导组、技术指导组和现场工作组。","o":["正确","错误"],"a":[0],"r":[],"i":1199},{"c":1,"b":3,"m":3,"t":2,"q":"危险货物道路运输事故现场，救援人员在开展危险货物运输事故应急过程中，应采取有效的安全防护措施，科学施救，在保证自身安全的前提下开展应急工作。","o":["正确","错误"],"a":[0],"r":[],"i":1200},{"c":1,"b":3,"m":3,"t":3,"q":"某日，成名高速公路名山服务区（成都方向）发生一起装载重烃的危险货物车辆泄漏爆炸燃烧事故，造成2人死亡（该危险品运输车辆司机何某与押运员张某）、2人受伤，直接经济损失441万元。经调查：事故车辆川RXXXXX柴油罐车为何某出资购买，以参营方式加入A危险品运输企业，车辆日常维修维护、日常检查、货物运输业务均自行负责，每年回公司一次办理年审业务，并给公司缴纳代购保险费用、保证金及管理费用。公司为何某代购保险，与其签订聘用合同，建立人员车辆档案及相关管理资料，日常培训以线上为主；川RXXXX柴油罐车适装介质为柴油，违法运输重烃，且罐体呼吸阀不能起到泄压作用。运输过程中罐内压力升高，气体从罐车顶部油气回收阀连接管处泄漏。驾驶员、押运员违规处置泄漏点时致重烃喷出，重烃与空气混合形成爆炸性气体云团，遇服务区综合楼外运行的非防爆制冷设备压缩机组引发爆炸燃烧。根据案例内容，下列说法正确的是（  ）。","o":["该运输企业主要负责人，未依法履行安全管理职责，对本次事故负主要管理责任，涉嫌重大责任事故罪","罐式专用车辆的罐体应当经检验合格，且罐体载货后总质量、适装介质与专用车辆的罐体相匹配","运输企业安全制度未落实，未对车辆运输介质符合性进行管控","使用压力容器运输危险货物的，应当符合国家特种设备安全监督管理部门制订并公布的《移动式压力容器安全技术监察规程》等有关技术要求"],"a":[0,1,2,3],"r":[],"i":1201},{"c":1,"b":3,"m":3,"t":3,"q":"某日，某油罐车装载柴油8600千克（核载8000千克），在给一加油站配送过程中，以62公里/小时速度途径某乡没有中心线的公路，与迎面而来的轻型货车发生刮擦碰撞后侧翻，事故造成危险品运输车辆押运员死亡、驾驶员受伤，两辆车辆不同程度损坏；油罐侧翻后阀门破损，致使约2.5吨柴油泄漏。经调查：该企业危险货物运输资质是两年前获得的；死亡的押运员没有危险货物运输从业资格证，仅是经过企业进行简单岗前培训后即上岗作业；该企业原有7辆车进行成品油配送，上一年报废3辆，现有4辆运营；企业安全生产管理制度未落实，对其驾驶员安全生产教育时有时无。根据案例内容，下列说法正确的是（  ）。","o":["该危险品车辆存在超速、超载行为","押运员必须获得相应的从业资格证，才能从事危险货物的押运员工作","运输企业主要负责人未依法履行安全管理职责，押运员未取得从业资格依旧上岗作业","该企业的危险货物运输资质没有问题，但安全生产管理存在问题"],"a":[0,1,2],"r":[],"i":1202},{"c":1,"b":3,"m":3,"t":3,"q":"某日，河北张石高速公路速浮图峪5号隧道中，一辆重型半挂危险品运输车辆行驶发生初始燃烧爆炸，发出较大声音和火光，隧道内司乘人员迅速逃生，隧道入口后方车辆停在隧道口造成排队拥堵。之后，燃烧爆炸的强热引发氯酸钠和爆炸性混合物爆炸，爆炸产生的冲击波造成6部车辆损毁、15人遇难、3人重度烧伤，事故波及高速公路旁43户民房受损，16名村民轻微伤，造成直接经济损失4200万元。经调查：事故车辆装载大体积的氯酸钠，在运输过程中，由于货物与货物、货物与车辆底板、货物与车厢残留的石油焦粉末(含硫)等杂质之间相互摩擦产生热量并不断聚集，后一桥左侧车轮橡胶轮胎自燃，引燃了捆绑绳、篷布和密封布，厢体温度升高，当能量聚集达到氯酸钠爆燃点时，发生了氯酸钠初始燃烧并引发了后续爆炸和燃烧。根据案例内容，以下说法正确的是（  ）。","o":["车辆在装运易燃易爆危险货物时，应使用木板或橡胶板作为防护衬垫","企业未落实安全生产主体责任，安全管理存在问题","在装运危险货物前需要将货仓清理干净，以免有危险货物遗留、撒漏","在发生紧急情况时，驾驶员、押运员可不管不顾，直接逃离"],"a":[0,1,2],"r":[],"i":1203},{"c":1,"b":3,"m":3,"t":3,"q":"某日，鲁YXXXXX小型面包车沿荣乌高速公路由西向东行驶至饮马池大桥，因路面结冰，小型面包车失控与中央隔离带钢板护栏碰撞后停在车道上，后冀JXXXXX重型罐式货车躲避此车辆发生侧滑，与桥护栏发生碰撞刮擦后撞到面包车左后尾部，斜停于左侧车道和右侧车道。后鲁FXXXXX大型普通客车与冀JXXXXX重型罐式货车追尾碰撞造成罐式货车卸油口损坏，所载汽油泄漏(约2吨)。撞击产生的火花引起油罐车泄漏的汽油蒸汽与空气的混合物爆燃，引燃事故车辆，造成12人死亡(8人烧死，4人跳车坠桥死亡)，6人受伤的重大事故，造成直接经济损失3200万元。经调查：油罐车押运员在非装卸时未关闭紧急切断阀，违反了紧急切断阀操作规程，导致油罐车泄漏了大量汽油；危险品运输企业制定了安全教育学习制度，但驾驶员、押运员长期未参加安全教育培训，事故发生后驾驶员、押运员未能及时按照要求设置事故警示标志。根据案例内容，以下说法正确的是（  ）。","o":["驾驶员、押运员应当确保罐式车辆罐体、可移动罐柜、罐箱的关闭装置在运输过程中处于关闭状态","从事危险品运输的企业，要依法加强对驾驶员、押运员的安全教育","危险品运输车辆途经临水、临崖、隧道、桥梁等重点路段,应当减速慢行,注意警告标志及提示信息,请服从公安机关交通管理部门及民警的指挥和管理","企业未落实安全生产主体责任，安全管理存在问题"],"a":[0,1,2,3],"r":[],"i":1204},{"c":1,"b":3,"m":3,"t":3,"q":"某日，连霍高速河南省三门峡市境内741公里加900米处义昌大桥。货车上运输的烟火药剂爆炸物(土地雷)和烟花爆竹(开天雷)发生爆炸，致使义昌大桥坍塌，车辆坠落桥下，事故造成13人死亡、9人受伤，直接经济损失约7632万元。经调查：该运输企业及有关人员疏于管理，不按规定对所属车辆驾驶员进行安全教育及运输行业相关法律法规的培训，无危险货物道路运输资质、使用普通货运车辆从事危险货物运输，运输时用百货名义替代危险物品填写运输合同；途中紧急刹车，导致车厢内爆炸物发生撞击、摩擦引发爆炸；车辆超载运输，两种货物总重量约12365千克，超载6440千克；装载的烟火药剂爆炸物和烟花爆竹均不属于国家规定的产品，属于非法产品。根据案例内容，以下说法正确的是（  ）。","o":["危险品运输车辆超负荷的运载不仅破坏道路等设施，更容易对驾驶人和其他交通参与者人身造成威胁，加重事故后果","该运输企业安全生产主体责任落实不到位，对事故发生负有主要责任","严禁道路运输企业不具备运输危险货物资质，将危险货物伪装成普通物品运输","运输民用爆炸物品、烟花爆竹的企业，应当具有第一类爆炸品或者第一类爆炸品中相应项别运输资质"],"a":[0,1,2,3],"r":[],"i":1205},{"c":1,"b":3,"m":3,"t":3,"q":"某日，李某驾驶桂BXXXX挂车，由河南至浙江途径宁洛高速曹庄服务区时，因途中遇雨，车厢渗入雨水，导致车内危化品连二亚硫酸钠（保险粉）遇水发生自燃事故。此次事故货物保险粉损失29吨，危化品挂车车厢损坏，直接经济损失约20万元。经调查认定：此次事故是一起因雨天防雨措施不到位，危化品运输车内保险粉燃烧的责任事故。根据案例内容，以下说法正确的是（  ）。","o":["事故的主要原因的是运输保险粉车辆，没有采取防雨措施，导致雨水漏进车厢，车厢内保险粉遇水自燃","该运输企业没有督促驾驶员落实保险粉安全防护（防雨）措施，没有对车辆的安全性进行再确认，导致运输的保险粉遇水反应自燃，该运输企业对本起事故负主要责任。","该运输企业安全生产管理存在盲区，最终导致发生事故，事故造成一定的社会影响。","本次事故是驾驶员导致的，没有违反《安全生产法》"],"a":[0,1,2],"r":[],"i":1206},{"c":1,"b":3,"m":3,"t":3,"q":"某日，内蒙古包头市驾驶人陈某驾驶蒙XXXXX号宇通牌卧铺大客车，沿包茂高速公路由北向南行驶至484公里加95公里处，遇河南省（焦作）孟州市驾驶人闪某驾驶的重型罐式半挂汽车列车从匝道违法驶入高速公路且低速行驶（时速21公里，明显低于高速公路最低车速每小时60公里的要求），大客车与汽车列车发生追尾碰撞，致罐式半挂车内甲醇泄漏并起火，造成大客车内36人当场死亡（含驾驶人），3人受伤，直接经济损失3160.6万元。经调查：重型半挂货车驾驶人闪某从匝道违法驶入高速公路，在高速公路上违法低速行驶，导致卧铺大客车追尾碰撞重型半挂货车。重型半挂汽车列车所属道路运输企业对驾驶员的安全管理不到位。本起事故中，重型半挂汽车列车所属道路运输企业未对驾驶员行车过程进行有效监督管理，使得驾驶员闪某在高速路面低速行驶行为未能得到及时纠正。根据案例内容，以下说法正确的是（  ）。","o":["驾驶员驾驶危险运输车辆时应遵守交通规则，遵守交通信号灯、交通标志和标线的指示，不得超速或低速行驶","从事危险品运输的企业，要依法加强对驾驶员、押运员的安全教育","危险品运输车辆在路上应服从公安机关交通管理部门的管理，可以不受运输企业的管理","企业未落实安全生产主体责任，安全管理存在问题"],"a":[0,1,3],"r":[],"i":1207},{"c":1,"b":3,"m":3,"t":3,"q":"某日，沈海高速往福建方向萧江路段一辆运载32类硝酸的危化品运输车车辆头部发生起火事故，并随时可能蔓延至车厢内的危化品。公安机关立即安排警力将后方来车全部截停，等待消防车到达，同时封闭辖区各收费站进口，安排民警在平阳出口进行车辆分流，防止无关人员和车辆进入现场。后经消防人员扑灭，事故无人员伤亡，危化品未发生泄漏。经调查，车辆是因电路问题而发生自燃，运输企业没有按照规定定期对车辆进行检查；危险品运输企业制定了安全教育学习制度，但驾驶员、押运员长期未参加安全教育培训。根据案例内容，以下说法正确的是（  ）。","o":["危化品运输车辆所属道路运输企业未能督促驾驶员严格执行日常车辆维护制度","企业未落实安全生产主体责任，安全管理存在问题","在发生紧急情况时，驾驶员、押运员报警后可直接逃离","道路运输企业应加强驾驶员的安全培训教育。使驾驶员认识到车辆安全检查和车辆维护的重要意义，做好车辆的日常安全检查工作。"],"a":[0,1,3],"r":[],"i":1208},{"c":1,"b":3,"m":3,"t":3,"q":"某日，广深沿江高速发生一起湘LXXXX中型自卸货车与油罐车追尾相撞交通事故，追尾碰撞导致湘B XXXXX油罐车装载的溶剂油泄漏，泄漏溶剂油流淌至离高速公路高架桥下方约12米及高架桥下及周边的货物堆场、工棚，挥发的可燃气体与空气混合形成爆炸性的混合气体，遇桥下过往机动车产生的火花，引起连环爆燃，造成20人死亡、31人受伤，直接经济损失约4600万元。经调查，湘B XXXXX油罐车违规在高速公路高架上停车，导致后车追尾是事故的主要原因，运输企业对挂靠经营的危险化学品运输车辆只收取管理服务费，但没有进行管理，无安全管理制度，无专职的安全管理员，未对驾驶员、押运员进行的安全培训教育，完全交由各挂靠车队自行经营管理，纵容了所属车辆的道路交通违法行为。根据案例内容，以下说法正确的是（  ）。","o":["危化品运输车辆所属道路运输企业未能督促驾驶员、押运员进行的安全培训教育","企业未落实安全生产主体责任，安全管理存在问题","上述事故因车辆驾驶人麻痹大意停车导致，因此驾驶人因故障或有事情而需要停车时，切勿莽撞随意。要严格按照《道路交通安全法》的有关规定，将车安全停放","在高速公路发生事故需要停车时，先把双闪灯打开，在快速拍照取证后记得把事故车辆开至应急车道，并把三角警示牌设置在事故车后150米以外，尽快报警求助。"],"a":[0,1,2,3],"r":[],"i":1209},{"c":1,"b":3,"m":3,"t":3,"q":"某日，驾驶员王某在凌晨2时参加完聚会，于8时驾驶危险货运运输车辆到云南省某地前往江苏常熟市。当车辆行驶至高速公路时，驾驶员王某因喝酒导致昏睡，致使车辆与中央隔离带护栏发生碰撞，并越过护栏后向右侧翻，与对向车道刘某驾驶的中型厢式货车相撞，造成4人死亡，直接经济损失约20万元。经调查，王某的血液酒精含量为33mg/100ml，属于饮酒后驾驶；运输企业对挂靠经营的危险化学品运输车辆无安全管理制度，无专职的安全管理员，完全交由各挂靠车队自行经营管理，纵容了所属车辆的道路交通违法行为。根据案例内容，以下说法正确的是（  ）","o":["危化品运输车辆所属道路运输企业未能督促驾驶员、押运员进行的安全培训教育","企业未落实安全生产主体责任，安全管理存在问题","该驾驶员王某属于酒驾","该驾驶员王某属于醉驾"],"a":[0,1,2],"r":[],"i":1210},{"c":1,"b":4,"m":0,"t":0,"q":"根据《道路旅客运输及客运站管理规定》，关于客车出站检查，下列说法中错误的是（  ）。","o":["出站检查人员应检查出站客车报班手续是否完备","出站检查人员应检查客车出站前《安全例检合格通知单》、行驶证、道路运输证、客运标志牌等单证经过车站查验且合格","出站检查后的所有客车，出站检查人员签字确认即可","不接受出站检查的，客运站有权拒绝客车出站"],"a":[2],"r":["道路旅客运输及客运站管理规定"],"i":1211},{"c":1,"b":4,"m":0,"t":0,"q":"根据《道路旅客运输及客运站管理规定》，申请从事客运站经营的，应当依法向市场监督管理部门办理有关登记手续后，向所在地县级（）提出申请。","o":["交通运输主管部门","公安交通管理部门","市场监督管理","应急管理部门"],"a":[0],"r":["道路旅客运输及客运站管理规定"],"i":1212},{"c":1,"b":4,"m":0,"t":0,"q":"根据《汽车客运站安全生产规范》，汽车客运站领导和工作人员应当既对分管的业务工作负责，又对分管业务范围的安全生产工作负责，该制度被称之为（  ）。","o":["一把手负责制","一岗双责制","党政同责制","双岗双责制"],"a":[1],"r":["汽车客运站安全生产规范"],"i":1213},{"c":1,"b":4,"m":0,"t":0,"q":"根据《汽车客运站安全生产规范》，下列需与客运站经营者签订安全生产管理协议的是（  ）。","o":["乘客","站内服务人员","入该站的营运客车驾驶员","进入该站的营运客车所属道路旅客运输经营者"],"a":[3],"r":["汽车客运站安全生产规范"],"i":1214},{"c":1,"b":4,"m":0,"t":0,"q":"根据《汽车客运站安全生产规范》，汽车客运站经营者应当对进出汽车客运站的人员和行李物品、车辆进行严格检查，确保“三不进站”和（  ）。","o":["“三不出站”","“四不出站”","“五不出站”","“六不出站”"],"a":[3],"r":["汽车客运站安全生产规范"],"i":1215},{"c":1,"b":4,"m":0,"t":0,"q":"根据《汽车客运站安全生产规范》，汽车客运站的主要负责人对本单位安全生产负有的职责不包括（  ）。","o":["建立健全本单位安全生产责任制，组织制定本单位安全生产规章制度和操作规程","督促、检查本单位安全生产工作，及时消除生产安全事故隐患","拟订本单位安全生产投入计划","组织制定并实施本单位安全生产教育培训计划"],"a":[2],"r":["汽车客运站安全生产规范"],"i":1216},{"c":1, "正确","错误"],"a":[1],"r":[],"i":1273},{"c":1,"b":4,"m":3,"t":2,"q":"对于安全例检不合格的客车，在营运客车调修后，不需要进行重复检查。","o":["正确","错误"],"a":[1],"r":[],"i":1274},{"c":1,"b":4,"m":3,"t":2,"q":"汽车客运站经营者在不改变客运站基本服务功能的前提下，可以拓展旅游集散、邮政、物流等服务功能。","o":["正确","错误"],"a":[0],"r":[],"i":1275},{"c":1,"b":4,"m":3,"t":2,"q":"出站检查登记表应由出站检查人员和驾驶员签字确认。","o":["正确","错误"],"a":[0],"r":[],"i":1276},{"c":1,"b":4,"m":3,"t":2,"q":"小件快运工作人员应做好所有托运货物的“三品”检查工作，必须开包检查。","o":["正确","错误"],"a":[1],"r":[],"i":1277},{"c":1,"b":4,"m":3,"t":2,"q":"营运客车安全例检合格后，调度发班环节不需要检查营运客车安全例行检查合格通知单。","o":["正确","错误"],"a":[1],"r":[],"i":1278},{"c":1,"b":4,"m":3,"t":2,"q":"汽车客运站调度室应对新进的车辆做好台账登记，录入车辆信息系统。","o":["正确","错误"],"a":[0],"r":[],"i":1279},{"c":1,"b":4,"m":3,"t":2,"q":"未经安全例检的营运客车，客运站不得排班发车，驾驶员不得用其运送旅客。","o":["正确","错误"],"a":[0],"r":[],"i":1280},{"c":1,"b":4,"m":3,"t":2,"q":"营运客车安全例行检查应在驾驶员的配合下，宜采用“双人作业法”进行。","o":["正确","错误"],"a":[0],"r":[],"i":1281},{"c":1,"b":4,"m":3,"t":2,"q":"汽车客运站应对托运人有效身份证件进行查验和登记。","o":["正确","错误"],"a":[0],"r":[],"i":1282},{"c":1,"b":4,"m":3,"t":2,"q":"根据《中华人民共和国反恐怖主义法》，公路长途客运站未依照规定对进入该场所的人员、物品和交通工具进行安全检查的，公安机关应当责令改正；拒不改正的，处十万元以下罚款，并对其直接负责的主管人员和其他直接责任人员处一万元以下罚款。","o":["正确","错误"],"a":[0],"r":["中华人民共和国反恐怖主义法"],"i":1283},{"c":1,"b":4,"m":3,"t":2,"q":"根据《中华人民共和国民法典》，宾馆、商场、银行、车站、机场、体育场馆、娱乐场所等经营场所、公共场所的经营者、管理者或者群众性活动的组织者，未尽到安全保障义务，造成他人损害的，应当承担赔偿责任。","o":["正确","错误"],"a":[1],"r":["中华人民共和国民法典"],"i":1284},{"c":1,"b":4,"m":3,"t":2,"q":"根据《道路运输企业和城市客运企业安全生产重大事故隐患判定标准（试行）》，汽车客运站经营的企业允许超载车辆出站的，不属于重大事故隐患。","o":["正确","错误"],"a":[1],"r":["道路运输企业和城市客运企业安全生产重大事故隐患判定标准（试行）"],"i":1285},{"c":1,"b":4,"m":3,"t":2,"q":"根据《交通运输行业反恐怖防范基本要求》，重点目标的管理单位应按照规定对进入码头、长途客运站的人员、物品和交通工具进行安全检查。对于拒绝接受安全检查或者携带违禁物品的旅客，应按照相关要求采取措施，制止其进站。","o":["正确","错误"],"a":[0],"r":["交通运输行业反恐怖防范基本要求"],"i":1286},{"c":1,"b":4,"m":3,"t":3,"q":"某日，某客运企业驾驶人张某、李某交替驾驶湘CXXXXX大型普通客车，从某客运站出发前往湖南省长沙市。出站时，车内共有51人（2名驾驶人、49名乘客)。20时18分，当该车行驶至湖南常长高速119公里加655米处，冲出护栏并仰翻，造成40人死亡、11人受伤，直接经济损失4024余万元。经调查：该车“营运客车安全例行检查合格通知单”签发日期为3天前；出站时，客运中心出站安检员秦某上车进行了检查，但没有严格检查相关证件、没有认真核对出站乘客人数，驾驶人冯某、王某没有在出站登记表上签字确认。根据案例内容，下列说法正确的是（  ）。","o":["该客运站没有落实安全生产管理责任制","出站检查制度形同虚设","出站登记表必须由当班驾驶员签字确认","“营运客车安全例行检查合格通知单”48小时内有效"],"a":[0,1,2],"r":[],"i":1287},{"c":1,"b":4,"m":3,"t":3,"q":"某日，某客运企业驾驶人杨某驾驶鲁VXXXXX中型普通客车，从某客运站出发前往山东省临沂市。出站时，车内共有22人：1名驾驶人、21名乘客（其中3人为免票儿童）。10时25分，沿青州市五文路行驶至邵庄镇集贸市场附近时，因制动失效，先后与一辆小货车、两辆面包车发生碰撞，并冲到赶集群众中，造成9人死亡、14人受伤，直接经济损失490余万元。经调查：该中型普通客车核载19人；该车制动性能不合格，驻车制动失效；安全例检人员违反例检工作规章制度和操作规程，在未对肇事车辆进行例检的情况下，违规出具合格报告。依据案例内容，下列说法正确的是（  ）。","o":["某客运站负责人未履行督促、检查安全生产工作职责","该车辆不具备出站条件","该车辆超载","该事故属于重大事故"],"a":[0,1,2],"r":[],"i":1288},{"c":1,"b":4,"m":3,"t":3,"q":"某日，某客运企业驾驶人邹某和孙某轮流驾驶鲁KXXXXX大型双层卧铺客车，从某客运站出发前往湖南长沙。出站时，车内共有35人（2名驾驶人以及33名乘客)。3时43分，该客车行驶至京珠高速河南信阳段938公里加115米处时突然发生爆燃，带着浓烟和火焰继续行驶了145米后停在938公里260米处，造成31人死亡、4人受伤，直接经济损失2342余万元。经调查：该客车道路运输证过期；该客车装载了2箱危险化学品偶氮二异庚腈；乘客李某通过客运站工作人员张某让装有危险货物的车辆直接驶入发车区，装入行李舱；出站登记表中未显示报班驾驶员与出站驾驶员不符。依据案例内容，下列说法正确的是（  ）。","o":["该客运站管理混乱，没有落实安全生产责任制","该客运站违反了“三不进站”的规定","出站检查流于形式","该事故属于特别重大事故"],"a":[0,1,2,3],"r":[],"i":1289},{"c":1,"b":4,"m":3,"t":3,"q":"某日，某交通运输综合行政执法支队对某客运站开展安全生产检查，详细检查了客运站的安全制度、车辆日常管理和驾驶人安全教育、运营台账等安全管理资料以及危险品查堵、出站检查等重点工作岗位。检查中发现：禁限运物品查控岗位工作人员不懂常见危险品的识别与处置方法；禁限运物品查控岗位工作人员同时承担咨询服务工作；该客运站主要负责人每年再培训时间为10学时；该客运站均是自主开展从业人员安全生产教育培训；“出站登记表”保存了1个月。依据案例内容，下列说法正确的是（  ）。","o":["禁限运物品查控岗位工作人员应经交通运输主管部门考核合格方能上岗","禁限运物品查控岗位工作人员在岗期间，不得开展与危险品查堵工作无关的活动","客运站主要负责人每年再培训时间应不少于12学时","客运站可以自主开展从业人员安全生产教育培训"],"a":[1,2,3],"r":[],"i":1290},{"c":1,"b":4,"m":3,"t":3,"q":"某日，贵州思南县一辆中型客车，行驶至枫芸乡境内某县道时，坠入道路弯道右侧垂高约15米高坎，造成8人死亡、13人受伤，直接经济损失658万余元、车辆严重损坏。经调查，驾驶人驾驶安全设施不全、机件不符合技术标准等具有安全隐患的机动车上路行驶，超过核定人数且未按照操作规范安全驾驶、文明驾驶，临危措施处置不当，是造成此事故的直接原因。客运站安全例检走过场，对车辆左右后轮半轴油封陈旧性漏油现象未发现，出站安全检查人员未认真核对乘员数与售票数，未认真检查乘客安全带扣系情况。根据案例内容，下列说法正确的是(  )。","o":["该起事故的直接原因是驾驶员操作处置不当，因此事故责任与汽车客运站无关","客运车辆按规定开展日常维护、一级维护和二级维护后，可以不开展安全例检","“营运客车安全例行检查合格通知单”有效期为24小时","汽车客运站“出站登记表”应由出站检查人员和驾驶员双方签字","出站检查人员应认真检查每一名乘客安全带扣系情况，对于未扣系安全带的乘客，应提醒其按规定扣系安全带"],"a":[2,3,4],"r":[],"i":1291},{"c":1,"b":4,"m":3,"t":3,"q":"某日，一辆大客车行驶至G22青兰高速公路甘肃平凉泾川段时，车辆在向左变更车道过程中，与中央隔离带护栏发生碰撞后，向右急转撞毁右侧护栏驶出路外，侧翻于路基边坡。车内大部分人员未按规定使用安全带，部分人员被甩出车外，并被侧翻大客车碾压，造成13人当场死亡，44人受伤。经调查，驾驶员驾驶制动系统不符合国家技术标准要求且下部行李舱超载168.6%的客车，在雨天道路湿滑的情况下，未保持安全行驶速度，应急操作不当是事故发生的直接原因。大部分乘客未系安全带，在事故发生时脱离座椅，被挤压或被甩出车外后被事故车辆侧压，加重了事故伤亡后果。根据案例内容，下列说法正确的是(  )。","o":["驾驶员未保持安全行驶速度，应急操作不当是事故发生的直接原因","客车行李舱装载货物时，应合理均衡配重，避免因装载不合理导致车辆运行时重心偏移","对于道路客运车辆，没有允许最大总质量要求","乘客未系安全带是导致乘客伤亡后果加重的重要原因","该事故属于一起特大事故"],"a":[0,1,3],"r":[],"i":1292},{"c":1,"b":4,"m":3,"t":3,"q":"某日，陕西省安康市境内京昆高速公路秦岭1号隧道南口处发生一起大客车碰撞隧道洞口端墙的特别重大道路交通事故,造成36人死亡、13人受伤,直接经济损失3533余万元。经调查，8月9日发车，成都某客运站出站时仅有两名驾驶人的签名，另一名系伪造。8月10日在成都某客运站没有进行车辆例检的情况下办理了报班发车手续，出站时检查人员没有严格检查相关证件、没有认真核对出站乘客人数，两名驾驶员没有在出站登记表上签字确认，出站时实际为41人，其中19人未购票上车。根据案例内容，关于客运站出站检查，下列说法正确的是(  )。","o":["检查出站营运客车报班手续是否完备，确保营运客车出站前机动车行驶证、道路运输证、客运标志牌、“营运客车安全例行检查合格通知单”等单证经客运站查验合格","核验每一名当班驾驶员持有的从业资格证、机动车驾驶证，确保受检驾驶员与报班的驾驶员一致","清点营运客车载客人数，确保营运客车不超载出站。如发现营运客车有超载行为，应当立即制止，并采取相应措施安排旅客改乘；","检查旅客安全带系扣情况，确保营运客车出站时所有旅客系好安全带","出站检查记录表只需出站检查人员签字，无需驾驶员签字确认"],"a":[0,1,2,3],"r":[],"i":1293},{"c":1,"b":4,"m":3,"t":3,"q":"某日，驾驶人驾驶大客车（核载37人，实载33人）行驶至延西高速66KM+200M处时，低头翻看手机，大客车偏离原车道，驾驶人开始修正方向，在距隧道出口25M处大客车向左侧滑，驶出隧道后车体与护栏先后发生三次碰撞，车体离地翻转，共造成8人当场死亡、21人受伤，直接经济损失约1005万元。经调查，驾驶人驾驶大客车从客运站出站至事故发生时，共有吸烟行为5次，接打电话、使用手机12次，使用电话手表2次，事发前2分钟内驾驶人仍在接打、查看手机。涉事公司对承包经营车辆只收费、不管理，“以包代管”，未按规定对驾驶员不安全驾驶行为进行实时监控，涉事客车2021和2022年共有超速报警235次，只提供处理单据8份。根据案例内容，下列说法正确的是(  )。","o":["对多次存在违法、违规行为的驾驶员应作为重点监控和安全培训教育的重点对象","动态监控人员对经提醒仍然继续违法驾驶的客运驾驶员，只需记录在动态监控台账","涉事客车2021和2022年共有超速报警235次，只提供处理单据8份，构成重大事故隐患","客运企业委托第三方机构监控的，可以不建立企业内部动态监控管理台账","该事故属于一起较大事故"],"a":[0,2,4],"r":[],"i":1294},{"c":1,"b":4,"m":3,"t":3,"q":"某日，一辆中型普通客车，沿青州市五文路行驶至邵庄镇文登社区西郭庄村集贸市场附近时，因制动失效，先后与一辆小货车、两辆面包车发生碰撞，并冲到赶集群众中，造成9人死亡、14人受伤，直接经济损失约490余万元。经调查，肇事车辆所有人、管理人未及时对肇事车辆故障进行检修，客车制动性能不合格。涉事客运站明知受委托方检测能力达不到安全例检要求仍然委托其开展安全例检且未签订专门的安全管理协议，致使营运客车漏检不检问题存在，例检人员在未对肇事车辆进行例检的情况下，违规出具合格报告，致使肇事车辆存在安全隐患上路运营。根据案例内容，下列说法正确的是(  )。","o":["客车安全例行检查场所应设有地沟或者车辆举升装置","采用气压制动的营运客车，应在地沟内或者举升装置下方，检查各车轮制动气室、气阀及制动管路的密封性，应无漏气声","采用液压制动的营运客车，检查各车轮制动分泵及可视制动管路的密封性，应无油液滴漏现象","客车制动气压表不能正确指示系统压力，但制动管路密封性良好的情况下，可以正常安排发车","对于单程运营里程在800公里（含）以   function inBtype(q, bt) { return q.c === 0 || !bt || q.b === bt; }
